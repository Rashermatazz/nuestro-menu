<style>
/* Layout: una columna de app móvil (máx. 560px), barra de pestañas fija abajo, fichas blancas sobre fondo cálido; el amarillo marca lo activo. */
:root{
  --bg:#f7f6f2; --card:#ffffff; --line:#ebe8e0; --fg:#1d1c1a; --muted:#6c6a63; --soft:#f0eee7;
  --accent:#ffd23f; --accent-soft:#fff3c4; --on-accent:#1d1c1a; --accent-ink:#7a5c00;
  --des:#fff3c4; --com:#e2f2e6; --mer:#fde5da; --cen:#e5ebfa; --ink-des:#6b5200; --ink-com:#1c5a3a; --ink-mer:#8a3b1e; --ink-cen:#2a468c;
  --ok:#1f7a4d; --danger:#b3321f; --rec-soft:#fde0cc; --shop-soft:#f6dde3; --bad-soft:#fbe1dc; --bad-ink:#8a2b1c;
  --f-body:'Poppins', ui-sans-serif, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141412; --card:#1e1d1a; --line:#302e28; --fg:#f2f0ea; --muted:#a8a498; --soft:#26251f;
  --accent:#ffd23f; --accent-soft:#3a321a; --on-accent:#1d1c1a; --accent-ink:#ffd86b;
  --des:#3a3218; --com:#1c3325; --mer:#3b261d; --cen:#1f2740; --ink-des:#ffd86b; --ink-com:#8fd8ac; --ink-mer:#ffb293; --ink-cen:#a9bdf5;
  --ok:#6fd39c; --danger:#ff8a75; --rec-soft:#3d2a1c; --shop-soft:#3a2329; --bad-soft:#3d221d; --bad-ink:#ffb0a3; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#141412; --card:#1e1d1a; --line:#302e28; --fg:#f2f0ea; --muted:#a8a498; --soft:#26251f;
  --accent:#ffd23f; --accent-soft:#3a321a; --on-accent:#1d1c1a; --accent-ink:#ffd86b;
  --des:#3a3218; --com:#1c3325; --mer:#3b261d; --cen:#1f2740; --ink-des:#ffd86b; --ink-com:#8fd8ac; --ink-mer:#ffb293; --ink-cen:#a9bdf5;
  --ok:#6fd39c; --danger:#ff8a75; --rec-soft:#3d2a1c; --shop-soft:#3a2329; --bad-soft:#3d221d; --bad-ink:#ffb0a3; color-scheme:dark }
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font-family:inherit;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px calc(96px + env(safe-area-inset-bottom,0px))}
h1{font-size:24px;font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.3px}
h2{font-size:17px;font-weight:600;margin:0}
.muted{color:var(--muted)}
.top{display:flex;align-items:center;gap:10px;padding:10px 0 12px}
.top h1{flex:1}
.ib{width:44px;height:44px;border:none;border-radius:12px;background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;border:1px solid var(--line);flex:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px}
/* inicio */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:26px 0 18px}
.logo{width:60px;height:60px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.logo svg{stroke:var(--on-accent)}
.nav-card{display:flex;align-items:center;gap:14px;width:100%;padding:14px;margin-bottom:10px;text-align:left;cursor:pointer;min-height:72px}
.nav-card.hi{background:var(--accent-soft);border-color:transparent}
.nav-card.rec{background:var(--rec-soft);border-color:transparent}
.nav-card.shop{background:var(--shop-soft);border-color:transparent}
.nav-card .t{flex:1;display:flex;flex-direction:column}
.nav-card .t b{font-size:15px;font-weight:600}
.nav-card .t span{font-size:13px;color:var(--muted)}
.today{padding:14px;margin-bottom:14px;display:flex;flex-direction:column;gap:8px}
.today-row{display:flex;gap:10px;align-items:baseline;font-size:14px}
.today-row b{flex:none;width:104px;white-space:nowrap;font-weight:600;font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.today-row b .emo{margin-right:5px}
.tr-btn{width:100%;border:none;background:transparent;text-align:left;font:inherit;color:var(--fg);cursor:pointer;padding:6px 0;min-height:44px}
.tr-btn>span:nth-child(2){flex:1}
/* chips de días */
.weekbar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.wk{flex:none;min-height:40px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600;cursor:pointer}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;padding:4px;margin-bottom:12px}
.chip{min-height:56px;border:none;border-radius:11px;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11.5px;line-height:1.2}
.chip b{font-size:16px;font-weight:600}
.chip.on{background:var(--accent);color:var(--on-accent)}
.chip.is-today:not(.on) b{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.seg{display:flex;gap:4px;background:var(--soft);border-radius:12px;padding:4px;margin-bottom:12px}
.seg button{flex:1;min-height:40px;border:none;border-radius:9px;background:transparent;font-size:13px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--accent);color:var(--on-accent);font-weight:600}
/* comidas */
.meal{padding:12px;margin-bottom:12px}
.meal-h{display:flex;align-items:center;gap:8px;padding:0 2px 10px}
.meal-h h2{flex:1}
.pill{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pair.one{grid-template-columns:minmax(0,1fr)}
.mc{display:flex;flex-direction:column;gap:6px;padding:8px;border:1px solid var(--line);border-radius:12px;background:var(--card);text-align:left;cursor:pointer;min-width:0}
.mc[disabled]{cursor:default}
.mc .who{display:flex;justify-content:space-between;font-size:12px;font-weight:600}
.mc .dn{font-size:13px;font-weight:600;line-height:1.3}
.mc .g{font-size:12px;color:var(--muted);line-height:1.35}
.mc .ps{font-size:12px;color:var(--accent-ink);font-weight:500}
.ph{border-radius:10px;height:84px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.t-des{background:var(--des);color:var(--ink-des)} .t-com{background:var(--com);color:var(--ink-com)} .t-mer{background:var(--mer);color:var(--ink-mer)} .t-cen{background:var(--cen);color:var(--ink-cen)} .t-base{background:var(--soft);color:var(--muted)}
.ph svg{stroke:currentColor;opacity:.8}
.kc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:12px;font-size:13px}
.kc .card{padding:10px 12px;font-variant-numeric:tabular-nums}
.note{font-size:13px;line-height:1.45;padding:12px 14px;background:var(--accent-soft);border-radius:14px;margin-bottom:12px}
/* recetas */
.search{display:flex;align-items:center;gap:8px;padding:0 12px;min-height:46px;margin-bottom:10px}
.search input{flex:1;border:none;background:transparent;font:inherit;color:inherit;min-height:44px;outline:none}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.f{min-height:36px;padding:0 14px;border:none;border-radius:99px;background:var(--soft);font-size:13px;cursor:pointer}
.f.on{background:var(--accent);color:var(--on-accent);font-weight:600}
.rsec{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;margin:16px 0 8px}
.rsec-ic{font-size:18px}
.rlist{padding:0 4px 0 14px}
.rrow{display:flex;align-items:center;gap:10px;width:100%;min-height:58px;border:none;border-bottom:1px solid var(--line);background:transparent;text-align:left;cursor:pointer;padding:8px 0;font:inherit;color:var(--fg)}
.rrow:last-child{border-bottom:none}
.rrow-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.rrow-t b{font-size:14.5px;font-weight:600;line-height:1.3}
.rrow-t small{font-size:12.5px;color:var(--muted);line-height:1.3}
.rrow-m{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.rrow-m small{font-size:11.5px;color:var(--muted)}
.chev{color:var(--muted);font-size:18px;padding-right:6px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.rc{display:flex;flex-direction:column;gap:6px;padding:8px;text-align:left;cursor:pointer;min-width:0}
.rc .ph{height:104px}
.rc b{font-size:13px;font-weight:600;line-height:1.3}
.rc .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
/* ficha */
.rhero{margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px))) 0;height:230px;border-radius:0 0 22px 22px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.rhero img{width:100%;height:100%;object-fit:cover}
.rhero .ib{position:absolute;top:12px;left:max(16px,env(safe-area-inset-left,0px))}
.rhero .phtxt{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-size:12px}
.photo-actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--danger)}
.btn.block{width:100%;justify-content:center;min-height:52px;font-size:15px}
.rtitle{font-size:22px;font-weight:700;line-height:1.25;margin:14px 0 6px;text-wrap:balance}
.rmeta{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:10px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tag{font-size:12px;font-weight:500;padding:4px 11px;border-radius:99px;background:var(--com);color:var(--ink-com)}
.sect{font-size:16px;font-weight:600;margin:18px 0 8px}
.ing{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.ing th{text-align:left;font-size:11.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);font-weight:600;padding:4px 0}
.ing td{border-top:1px solid var(--line);padding:8px 0}
.ing td:nth-child(n+2),.ing th:nth-child(n+2){text-align:right;width:78px;white-space:nowrap}
.oil{font-size:13px;background:var(--soft);border-radius:12px;padding:10px 12px;margin-top:10px}
.cond{font-size:13px;color:var(--muted);margin-top:8px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.steps li{display:flex;gap:12px;font-size:14.5px;line-height:1.5}
.steps .n{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
.tips{background:var(--accent-soft);border-radius:14px;padding:12px 14px;margin-top:16px}
.tips ul{margin:6px 0 0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.cook{display:flex;flex-direction:column;gap:14px;padding-top:6px}
.cook .big{background:var(--accent-soft);border-radius:22px;padding:22px;min-height:46vh;display:flex;align-items:center;font-size:23px;line-height:1.45;font-weight:500}
.dots{display:flex;gap:5px;justify-content:center}
.dots i{width:22px;height:6px;border-radius:99px;background:var(--line)}
.dots i.on{background:var(--accent)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
/* lista */
.grp{border-bottom:1px solid var(--line)}
.grp-h{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;border:none;background:transparent;text-align:left;cursor:pointer;font-size:15px;font-weight:600;padding:0}
.grp-h .c{font-size:12px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.it{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;border:none;background:transparent;text-align:left;cursor:pointer;padding:4px 0 4px 4px}
.it .nm{flex:1;display:flex;flex-direction:column;min-width:0}
.it .nm b{font-size:14.5px;font-weight:500}
.it .nm small{font-size:12px;color:var(--muted)}
.it .q{font-size:13px;color:var(--muted);text-align:right;flex:none;max-width:40%}
.it.on .nm b{color:var(--muted);text-decoration:line-through}
.cb{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid var(--muted);display:flex;align-items:center;justify-content:center}
.on>.cb,.cb.on{background:var(--accent);border-color:var(--accent)}
.cb svg{stroke:var(--on-accent)}
.sync{font-size:12px;color:var(--muted);margin:-4px 0 12px;display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.live i{background:var(--ok)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;margin-top:8px}
/* barra inferior */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:6px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));z-index:5}
.tabbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.tab{min-height:54px;border:none;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;color:var(--muted);cursor:pointer}
.tab .ic{width:32px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center}
.tab svg{stroke:currentColor}
.tab.on{color:var(--fg);font-weight:600}
.tab.on .ic{background:var(--accent);color:var(--on-accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:9;max-width:90vw}
.empty{padding:30px 10px;text-align:center;color:var(--muted)}
.btn.sm{min-height:40px;padding:0 12px;font-size:13px}
.swapbtn{margin-top:10px;width:100%;justify-content:center}
.swapbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;flex-wrap:wrap}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.opt{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;font-size:13.5px}
.opt .cmp{font-size:12.5px;font-variant-numeric:tabular-nums}
.row2{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
a.btn{text-decoration:none;color:var(--fg)}
.tier{padding:14px;margin-bottom:12px}
.tier-h{display:flex;flex-direction:column;gap:2px;margin-bottom:10px}
.tier-h span{font-size:12.5px;color:var(--muted)}
.tier-ok{border-left:0;background:var(--com)} .tier-ok h2{color:var(--ink-com)}
.tier-mid{background:var(--des)} .tier-mid h2{color:var(--ink-des)}
.tier-bad{background:var(--bad-soft)} .tier-bad h2{color:var(--bad-ink)}
.tjumps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tjump{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:99px;font-size:12.5px;font-weight:600;text-decoration:none}
.tj-ok{background:var(--com);color:var(--ink-com)} .tj-mid{background:var(--des);color:var(--ink-des)} .tj-bad{background:var(--bad-soft);color:var(--bad-ink)}
.legend{font-size:12px;color:var(--muted);margin-bottom:12px;display:flex;align-items:center;gap:6px}
.mk{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;padding:1px 7px;border-radius:99px;background:var(--card);color:var(--fg);border:1px solid var(--line);vertical-align:1px}
.tier h2{display:flex;align-items:center;gap:8px}
.tic{width:26px;height:26px;border-radius:50%;background:var(--card);display:inline-flex;align-items:center;justify-content:center;font-size:14px}
.tcount{font-size:12px;font-weight:500;opacity:.75}
.fg{background:var(--card);border-radius:12px;padding:8px 12px;margin-top:8px}
.fgt{font-size:11.5px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);padding:2px 0 4px}
.flist{list-style:none;margin:0;padding:0}
.flist li{display:flex;flex-direction:column;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.flist li:first-child{border-top:none}
.fnote{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.fchipx{background:var(--card);border-radius:99px;padding:5px 11px;font-size:13px}
.trow{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:none}
.trow .it{flex:1}
.pillbtn{border:none;cursor:pointer;font:inherit;font-size:11.5px;font-weight:600;min-height:30px}
.emo{margin-right:6px;font-style:normal}
.reparto{display:flex;flex-direction:column;gap:3px;background:var(--accent-soft);border-radius:12px;padding:10px 12px;margin:10px 0 4px;font-size:13.5px}
.reparto b{font-size:14px}
.ml{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;border:none;border-top:1px solid var(--line);background:transparent;text-align:left;cursor:pointer;padding:8px 2px;font:inherit;color:var(--fg)}
.meal-h+.ml{border-top:none}
.meal-h:last-child{padding-bottom:0}
.ml:disabled{cursor:default}
.mname{flex:1;font-size:15px;font-weight:500;line-height:1.35}
.mtag{flex:none;font-size:11px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);width:58px}
.bsteps{list-style:none;margin:0;padding:4px 14px;counter-reset:b}
.bsteps li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.4}
.bsteps li:first-child{border-top:none}
.bsteps .whochip{min-height:28px;display:inline-flex;align-items:center;cursor:default;width:72px;justify-content:center}
.meal{padding:12px 14px 12px}
.meal .meal-h{padding:0 0 4px}
.meal .meal-h h2{font-size:12px;font-weight:600;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);display:flex;align-items:center}
.meal .meal-h h2 .emo{font-size:15px;margin-right:7px}
.mname{font-size:16.5px;font-weight:600;line-height:1.3;letter-spacing:-.1px}
.mtag{font-weight:500;color:var(--muted)}
.ml{min-height:44px;padding:6px 0}
.tl{position:relative;padding-left:24px;margin-top:4px}
.tl:before{content:"";position:absolute;left:8px;top:10px;bottom:14px;width:2px;background:var(--line);border-radius:2px}
.tli{position:relative;margin-bottom:16px}
.tdot{position:absolute;left:-24px;top:3px;width:18px;height:18px;border-radius:50%;border:3px solid var(--bg)}
.td-des{background:#f2c200} .td-com{background:#4caf7a} .td-mer{background:#f08a5d} .td-cen{background:#6d8be0}
.tli .meal-h{padding:0 0 6px;display:flex;align-items:center;gap:8px}
.tli .meal-h h2{flex:1;font-size:12px;font-weight:600;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;margin:0}
.tli .meal-h h2 .emo{font-size:15px;margin-right:7px}
.tlc{padding:4px 14px}
.tlc .ml:first-child{border-top:none}
.tlc .swapbtn{margin:6px 0 10px}
.tlc .opts{padding:8px 0 10px}
.pst{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--muted);border-top:1px dashed var(--line);padding:8px 0 10px;line-height:1.4}
.pst b{color:var(--fg);font-weight:600}
.brep{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.brep:first-child{border-top:none}
.brep-i{font-size:18px;width:24px;text-align:center}
.brep b{display:block;font-size:14px}
.brep small{display:block;font-size:12.5px;color:var(--muted)}
.bday{flex:none;font-size:11px;font-weight:600;background:var(--soft);border-radius:8px;padding:3px 7px;white-space:nowrap}
.wday{background:var(--card);border-radius:18px;padding:10px 14px 6px;margin-bottom:12px;scroll-margin-top:12px}
.wday.today{box-shadow:0 0 0 2px var(--accent)}
.wdh{display:flex;align-items:center;gap:8px;padding:2px 0 6px;border-bottom:1px solid var(--line)}
.wdh b{font-size:16px}
.hoy{font-size:11px;font-weight:600;background:var(--accent);border-radius:99px;padding:2px 9px}
.wk-k{margin-left:auto;font-size:11px;color:var(--muted)}
.wnote{font-size:12px;color:var(--muted);margin:6px 0 0}
.wr{display:flex;align-items:flex-start;gap:10px;padding:7px 0;border-top:1px solid var(--soft)}
.wdh+.wr,.wnote+.wr{border-top:none}
.wr-e{width:22px;text-align:center;font-size:16px;padding-top:9px}
.wr-b{flex:1;min-width:0;display:flex;flex-direction:column}
.wr-n{border:none;background:transparent;text-align:left;font:inherit;color:var(--fg);font-size:14.5px;font-weight:500;line-height:1.35;padding:8px 0 2px;cursor:pointer;min-height:36px}
.wr-n:disabled{cursor:default}
.wr-n+.wr-n{padding-top:0;min-height:28px}
.wr-w{font-size:12px;font-weight:600;color:var(--muted);margin-right:2px}
.wr-ps{font-size:12px;color:var(--muted);padding:0 0 4px}
.wr-sw{flex:none;width:36px;height:36px;margin-top:4px;border:1px solid var(--line);border-radius:10px;background:var(--soft);font-size:15px;cursor:pointer;color:var(--fg)}
.wr-sw.on{background:var(--com);border-color:transparent}
.wr-x{margin:0 0 10px 32px}
.wr-t{font-size:10.5px;font-weight:600;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);padding-top:8px}
.wr-t+.wr-n{padding-top:1px}
.wr-e{padding-top:6px !important}
.dreac{display:flex;gap:6px}.dr{flex:1;min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:20px;cursor:pointer}.dr.on{background:var(--accent);border-color:transparent}
.dsint{display:flex;flex-wrap:wrap;gap:6px}
.dent{padding:12px 14px;margin-bottom:8px}.dent-h{display:flex;gap:10px;align-items:center}.dent-e{font-size:24px}.dent-h b{display:block;font-size:14.5px}.dent-h small{font-size:12px;color:var(--muted)}
.dtags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.dtags span{font-size:11.5px;background:var(--mer);color:var(--ink-mer);border-radius:99px;padding:2px 9px}
.dnote{margin:8px 0 0;font-size:13px;color:var(--muted)}
.dstrip{position:sticky;top:0;z-index:4;display:flex;justify-content:space-between;gap:4px;background:var(--bg);padding:6px 0 10px;margin:0 0 4px}
.dsb{flex:1;border:none;background:var(--card);border-radius:12px;padding:6px 0;display:flex;flex-direction:column;align-items:center;font:inherit;font-size:11px;color:var(--muted);cursor:pointer;min-height:48px}
.dsb b{font-size:15px;color:var(--fg)}.dsb.on{background:var(--accent)}.dsb.on span{color:var(--on-accent)}
.wday{scroll-margin-top:72px}
.prep{margin:4px 0 8px;background:var(--cen);color:var(--ink-cen);border-radius:12px;padding:8px 10px;font-size:12.5px;line-height:1.4}
.wr-c{border:none;background:transparent;cursor:pointer;font:inherit;width:30px;height:34px;border-radius:9px;padding:0;margin-top:4px;font-size:16px}
.wr.done .wr-b{opacity:.45}.wr.done .wr-c{background:var(--ok);color:#fff;font-weight:700}
.tbtn{display:inline-flex;align-items:center;gap:4px;margin:6px 0 0;border:1px solid var(--line);background:var(--soft);border-radius:99px;padding:4px 10px;font:inherit;font-size:12px;font-weight:600;cursor:pointer;color:var(--fg)}
.steps li .tbtn{display:flex;width:max-content}
.tbtn.big-t{font-size:16px;padding:10px 18px;background:var(--accent);border-color:transparent}
.timers{position:fixed;left:10px;right:10px;bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:8;display:flex;flex-direction:column;gap:6px;max-width:540px;margin:0 auto}
.tmr{display:flex;align-items:center;gap:8px;background:var(--fg);color:var(--bg);border-radius:14px;padding:8px 10px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.tmr .tl{flex:1;font-size:12px;opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tmr b{font-size:18px;font-variant-numeric:tabular-nums}
.tmr button{border:none;background:rgba(255,255,255,.15);color:inherit;border-radius:8px;min-width:34px;height:32px;font:inherit;font-weight:600;cursor:pointer}
.tmr.end{background:var(--danger);animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.75}}
.sing{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}.sing span{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px 10px;font-size:13px;font-weight:500}
.cook .big{font-size:24px;cursor:pointer;user-select:none}
.bprog{display:flex;align-items:center;gap:10px;margin:0 0 10px;font-size:12.5px;color:var(--muted)}.bprog .bar{flex:1;height:8px;background:var(--soft);border-radius:99px;overflow:hidden}.bprog .bar i{display:block;height:100%;background:var(--ok)}
.bck{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:var(--card);font:inherit;font-size:12px;font-weight:700;cursor:pointer;color:var(--muted)}
.bsteps li.bdone .bck{background:var(--ok);border-color:var(--ok);color:#fff}.bsteps li.bdone>span:not(.bday):not(.whochip){opacity:.45;text-decoration:line-through}

 por persona).","Cazuela con la mitad del aceite a vitro 7: dora las albóndigas 4-5 min, girándolas. Sácalas.","Vitro 5, el resto del aceite: 120 g de ZANAHORIA en dados pequeños 5 min, luego 200 g de CALABACÍN 3 min.","300 g de TOMATE triturado y orégano, y las albóndigas de vuelta. Vitro 4, tapado, 15 min, hasta que estén hechas por dentro (parte una)."],"tips":["Manos mojadas para formar las bolas: no se pegan.","Aguantan 3 días en la nevera y se congelan bien."],"use":[],"alt":true,"grupo":"Carne blanca","sustituye":["wok-de-cerdo-con-arroz-integral-brocoli-y-verduras","estofado-de-pollo-con-arroz"]},{"id":"alt-brochetas-pollo","t":"Brochetas de pollo y verduras con patata","cat":"Cena","meta":"Cena · 30 min","cond":"sal, orégano, pimentón, limón","ing":[["pechuga de pollo","200 g","140 g"],["pimiento rojo","80 g","80 g"],["calabacín","100 g","100 g"],["patata","200 g","220 g"]],"oil":"1 cucharada sopera (≈14 g)","s":["420 g de PATATA en dados al microondas tapada con 2 cucharadas soperas de agua, 8-10 min.","Brochetas alternando dados de PECHUGA (340 g), PIMIENTO (160 g) y CALABACÍN (200 g). Aliña con especias y la mitad del aceite.","Sartén o plancha a vitro 8: 3-4 min por cada lado (4 lados), hasta que el pollo no tenga nada rosa.","En la misma sartén, la patata con el resto del aceite 3 min, hasta dorada. Limón al servir."],"tips":["Sin palillos, en dados igual de buenas: mismo tiempo.","Pollo y verdura del mismo tamaño para que se hagan a la vez."],"use":[],"alt":true,"grupo":"Carne blanca","sustituye":["pollo-al-horno-con-arroz-integral-y-verduras","wok-de-cerdo-con-arroz-integral-brocoli-y-verduras","estofado-de-pollo-con-arroz","estofado-de-pollo-con-patata","pollo-a-la-sarten-con-verduras-salteadas"]},{"id":"alt-lomo-patatas","t":"Lomo de cerdo con patatas y pimientos salteados","cat":"Comida","meta":"Comida o cena · 30 min","cond":"sal gorda, pimienta, romero, pimentón","ing":[["lomo de cerdo","180 g","130 g"],["patata","220 g","230 g"],["pimiento rojo","120 g","120 g"]],"oil":"1 cucharada sopera (≈14 g)","s":["450 g de PATATA en dados o gajos, tapada al microondas 6-8 min, hasta que se pueda pinchar.","Sartén con parte del aceite a vitro 6: 240 g de PIMIENTO en tiras, 6-8 min, hasta blando. Añade la patata con romero, vitro 7, 5 min, hasta dorada. Sal.","Sartén muy caliente (vitro 9) con un hilo de aceite: el LOMO en filetes, 1-2 min por lado, hasta que no quede rosa. Sal gorda al final."],"tips":["Lomo fino y poco tiempo: si se pasa, se seca.","Reposa 1 min antes de servir."],"use":[],"alt":true,"grupo":"Carne blanca","sustituye":["pollo-al-horno-con-arroz-integral-y-verduras","wok-de-cerdo-con-arroz-integral-brocoli-y-verduras","estofado-de-pollo-con-arroz","estofado-de-pollo-con-patata"]},{"id":"alt-burger-ternera","t":"Hamburguesa casera de ternera magra con boniato y ensalada","cat":"Cena","meta":"Cena · 30 min","cond":"sal, pimienta, pimentón ahumado; sin pan","ing":[["carne picada magra de ternera","150 g","150 g"],["boniato","200 g","220 g"],["ensalada de bolsa","60 g","60 g"],["tomate","120 g","120 g"]],"oil":"1 cucharada sopera (≈11 g)","s":["BONIATO (420 g) en dados, tapado al microondas 8-10 min, hasta que se pinche; luego 3 min en la sartén a vitro 7 para dorarlo.","Forma 2 hamburguesas con la carne picada (150 g cada una), sal y pimentón ahumado.","Sartén a vitro 8 casi sin aceite: 3-4 min por lado, bien hechas por dentro (sin rosa).","Ensalada con tomate y el aceite."],"tips":["Carne picada siempre bien hecha por dentro (sin rosa), y más desde noviembre.","Pide en la carnicería picada magra de ternera y haz 2 de 150 g."],"use":[],"alt":true,"grupo":"Carne roja","sustituye":["bistec-con-patatas-gajo-y-ensalada-de-col-rizada","bistec-con-patatas-y-pimiento-al-horno"]},{"id":"alt-macarrones-bocata","t":"Macarrones a la boloñesa estilo Bar Bocata","cat":"Comida","meta":"Comida · 50-55 min · sale para la cena","cond":"para los dos: 1 cucharada sopera de carne de ñora en tarro (o de pimiento choricero), 2-3 ramitas de tomillo (o 1 cucharilla pequeña seco), un rajolí de vino blanco (unas 2 cucharadas soperas), 1 cucharada sopera de vinagre balsámico si hay, sal y pimienta. Sin ajo, por Natalia","ing":[["carne picada magra de ternera","240 g","160 g"],["pasta sin gluten (seca)","150 g","100 g"],["tomate frito","120 g","80 g"],["tomate triturado","50 g","50 g"],["cebolla","50 g","50 g"],["zanahoria","35 g","35 g"],["caldo de pollo (bajo en sal)","40 ml","40 ml"]],"oil":"1 cucharada sopera (≈13 g)","s":["Antes de empezar: la CARNE, si está congelada, fuera del envase y al microondas en modo descongelar (indica el peso: 400 g); dale la vuelta cuando pite. Va directa a la olla.","Sofrito · vitro 7 · 3-4 min: olla grande con 1 cucharada sopera de aceite. Echa 100 g de CEBOLLA congelada (5 cucharadas soperas colmadas) y 70 g de ZANAHORIA congelada (3-4 colmadas), sin descongelar, hasta que se evapore el agua que sueltan.","Sofrito · vitro 5-6 · 10 min: añade 2-3 ramitas de tomillo, 1 cucharada sopera de carne de ÑORA y 100 g de TOMATE TRITURADO (6-7 cucharadas soperas). Remueve de vez en cuando hasta que esté todo bien tostado.","Carne · vitro 8 · 8-10 min: los 400 g de CARNE PICADA. Deshazla un poco y déjala quieta 2-3 min para que se dore y se pegue al fondo; remueve y repite. Sal y pimienta.","Desglasar · vitro 7 · 2 min: primero 1 cucharada sopera de vinagre balsámico (si hay) y luego un rajolí de VINO BLANCO (2 cucharadas soperas), rascando todo lo pegado del fondo.","Tomate frito · vitro 4 · 15 min: 200 g de TOMATE FRITO, mezcla y chup-chup suave.","Pasta, mientras tanto: 2,5 litros de agua a vitro 9; cuando hierva, 1 cucharada sopera rasa de sal y los 250 g de MACARRONES, y baja a vitro 7. Al dente: 1-2 min menos de lo que diga el paquete (si pone 11, pruébalos a los 9). Guarda medio vaso del agua al escurrir.","Caldo · vitro 4 · 15 min: 80 ml de CALDO de pollo (medio vaso pequeño) y deja guisar hasta que espese.","Juntar · vitro 3 · 1 min: los macarrones a la olla con la salsa; si queda seca, un chorrito del agua de la pasta. Sirve unos 3/5 para Mario y 2/5 para Natalia; lo que sobre, al táper de la cena."],"tips":["Es la receta del Bar Bocata para dos: 400 g de carne y 250 g de pasta. Es un plato contundente (≈945 kcal la ración de Mario), así que no sale en «Cambiar plato»: mejor para un día especial o el sábado.","Lo que se pega al fondo y se rasca al desglasar es el sabor de bar: no lo saltes.","Potencias para una vitro del 1 al 9: si se pega o huele a quemado, baja un punto y añade una cucharada de agua o caldo.","Macarrones siempre al dente: la pasta sin gluten se pasa enseguida.","La original lleva también ajo, manteca, butifarra, parmesano y brandy: aquí no van.","Cebolla bien cocinada y mezclada, que es como mejor la tolera Natalia.","La salsa se congela muy bien."],"use":[],"alt":true,"grupo":"Carne roja","sustituye":[]},{"id":"alt-salmon-boniato-brocoli","t":"Salmón a la plancha con boniato y brócoli","cat":"Cena","meta":"Cena · 30 min","cond":"sal, eneldo, limón, pimienta","ing":[["salmón (1 lomo)","125 g","125 g"],["boniato","200 g","200 g"],["brócoli (solo ramilletes)","80 g","60 g"]],"oil":"1 cucharada sopera (≈10 g)","s":["400 g de BONIATO en dados y 140 g de BRÓCOLI (solo ramilletes), tapados al microondas con un poco de agua 8 min, hasta tiernos.","Sartén con la mitad del aceite a vitro 7: dora el boniato y el brócoli 4 min, sal. Aparta.","Resto del aceite a vitro 6: SALMÓN con la piel hacia abajo 4 min, vuelta 2 min. Limón y eneldo."],"tips":["Salmón descongelado la noche antes en la nevera.","Brócoli congelado: sin descongelar, va directo a la bandeja."],"use":[],"alt":true,"grupo":"Pescado azul","sustituye":["salmon-con-patata-y-judias-verdes","salmon-con-boniato-y-judias-verdes","pasta-con-salmon-calabacin-y-tomate"]},{"id":"alt-merluza-horno-pimientos","t":"Merluza a la plancha con patata, tomate y pimiento","cat":"Cena","meta":"Cena · 35 min","cond":"sal, pimentón dulce, perejil, limón","ing":[["merlu es aguanta bien en la nevera hasta mediodía.","Si dejas la tortilla templar 1 min antes de meterla, el pan no se reblandece."],"use":["A mié","A jue","A vie","B mié","B jue","B vie"]},{"id":"tostadas-de-jamon-y-de-atun","t":"Tostadas de jamón y de atún","cat":"Desayuno","meta":"Mario · sábado · 5 min","cond":"sal","ing":[["pan 100 % integral","70 g","—"],["tomate","80 g","—"],["jamón Duroc","30 g","—"],["atún al natural","1 lata","—"],["mandarinas","1 u","—"]],"oil":"1 cucharilla pequeña (de café)","s":["Tuesta el pan integral.","Ralla el tomate, repártelo y un hilo de aceite: 1 cucharilla pequeña, de café, para todas.","En una, el jamón; en las otras, el atún escurrido. Mandarina de postre."],"tips":["Rallar el tomate con un rallador grueso: la piel se queda en la mano."],"use":["A sáb","B sáb"]},{"id":"tostadas-de-natalia","t":"Tostadas de Natalia","cat":"Desayuno","meta":"Natalia · 5-10 min","cond":"sal, pimienta","ing":[["pan de arroz","—","90 g"],["pechuguita de pollo asada (el sábado, jamón ibérico 30 g)","—","40 g"],["queso de cabra curado","—","25 g"],["kiwi (miércoles y jueves)","—","1 u"],["huevos (lunes y viernes)","—","2 u"]],"oil":"","s":["Tuesta el pan de arroz.","Encima, la pechuguita de pollo asada en lonchas y el queso de cabra. El sábado, jamón ibérico en vez de pollo.","Miércoles y jueves, con un kiwi. Lunes y viernes, 2 huevos: a la sartén con unas gotas de aceite, o cocidos 10 min."],"tips":["El paquete de pechuguita (100 g) da para 2-3 desayunos."],"use":["todos los días"]},{"id":"ensalada-de-col-rizada","t":"Ensalada de tomate, olivas y atún","cat":"Base","meta":"Base de las ensaladas · 5 min","cond":"sal, limón o vinagre","ing":[["tomate","120 g","120 g"],["olivas verdes","15 g","10 g"],["atún al natural","1 lata","1 lata"]],"oil":"1 cucharada sopera (≈16 g)","s":["Corta el tomate en gajos o dados.","Escurre la lata de atún al natural y añádela con las olivas.","Aliña con el aceite, una pizca de sal y unas gotas de limón o vinagre."],"tips":["El atún al natural escurrido: la proteína de la ensalada sin añadir aceite."],"use":[]},{"id":"pollo-al-horno-con-arroz-integral-y-verduras","t":"Pollo a la plancha con arroz basmati y verduras","cat":"Comida","meta":"Batch domingo · 35 min","cond":"salsa de soja tamari (1 cucharada sopera; sin más sal en el pollo), pimienta, pimentón dulce, orégano, romero; un poco de sal solo en la verdura","ing":[["pechuga de pollo","250 g","140 g"],["arroz basmati (seco)","60 g","70 g"],["calabacín","70 g","70 g"],["pimiento rojo","50 g","50 g"],["berenjena","50 g","50 g"],["zanahoria","50 g","50 g"],["mandarinas","1 u","2 u"]],"oil":"1 cucharada sopera (≈16 g)","s":["Arroz: cazo con agua abundante y sal a vitro 9. Cuando hierva, 130 g de ARROZ basmati (60 g Mario + 70 g Natalia) y baja a vitro 6. El tiempo del paquete (suele ser 10-12 min). Escurre.","Mientras, corta la verdura: 100 g de ZANAHORIA en rodajas finas (½ cm), 100 g de PIMIENTO y 100 g de BERENJENA en trozos medianos, 140 g de CALABACÍN en medias lunas gruesas.","Sartén grande con la mitad del aceite a vitro 7: la ZANAHORIA sola 4 min (es la más dura).","Añade PIMIENTO y BERENJENA, 5 min removiendo de vez en cuando. Luego el CALABACÍN, 3-4 min, hasta que esté tierno pero entero. Una pizca de sal y a un plato.","PECHUGA (390 g) en filetes, mezclada con 1 cucharada sopera de soja tamari y el pimentón; sin sal (la soja ya sala).","Misma sartén, resto del aceite, vitro 8: los filetes 3-4 min por cada lado, sin moverlos, hasta que no quede nada rosa por dentro (corta uno para mirarlo).","Un chorrito de limón por encima. Reparte: pollo y arroz según la tabla, verduras a medias, mandarina aparte."],"tips":["No amontones la verdura: en una capa se asa; amontonada, se cuece y suelta agua.","La berenjena chupa mucho aceite: dale la vuelta con las otras verduras en vez de añadirle más.","Si los filetes son gruesos, ábrelos en dos: se hacen igual que la verdura y no se secan.","El arroz basmati escurrido y extendido en un plato no se apelmaza en el táper.","Salsa de soja tamari Kikkoman sin gluten: de 1 cucharilla pequeña (de café) a 1 cucharada sopera para el plato de los dos. 1 cucharada sopera ≈ 2,5 g de sal: ese día, no añadas sal."],"use":["A lun"]},{"id":"guiso-de-sepia-con-patatas","t":"Guiso de sepia con patatas","cat":"Comida","meta":"Martes A · 50 min","cond":"sal, pimentón dulce, 1 hoja de laurel, perejil","ing":[["sepia limpia","150 g","120 g"],["patata","170 g","220 g"],["tomate triturado","80 g","80 g"],["pimiento rojo","60 g","60 g"],["zanahoria","50 g","50 g"],["cebolla","40 g","30 g"],["caldo de pescado","250 ml","200 ml"],["huevos","2 u","1 u"]],"oil":"1 cucharada sopera (≈14 g)","s":["Antes: cuece 3 HUEVOS 10 min en agua hirviendo (vitro 8), pásalos a agua fría y pélalos. Van partidos encima al servir.","Corta 270 g de SEPIA en dados de 2-3 cm y sécala con papel de cocina.","Cazuela con la mitad del aceite a vitro 8: marca la sepia 3-4 min, hasta que se vea blanca y algo dorada. Sácala a un plato.","Baja a vitro 4, el resto del aceite: 70 g de CEBOLLA muy picada con una pizca de sal, 8-10 min, hasta que esté transparente (sin dorarse).","Sube a vitro 5: 100 g de ZANAHORIA en dados pequeños, 5 min. Luego 120 g de PIMIENTO en dados, 4 min.","160 g de TOMATE triturado, 5 min. Fuera del fuego, 1 cucharilla pequeña de pimentón y remueve (así no se quema).","Vuelve la sepia, 1 hoja de laurel y 600-700 ml de CALDO de pescado. Cuando hierva, baja a vitro 4, tapa y 20 min con chup-chup suave.","Añade 390 g de PATATA chascada (corta un poco y rompe el trozo). 15-20 min más, sin tapa si hay mucho caldo, hasta que la patata se pinche fácil y la salsa espese.","Reposa 5 min con el fuego apagado, perejil y reparte: mitad y mitad; Mario algo más de sepia, Natalia algo más de patata. Huevos: 2 Mario, 1 Natalia."],"tips":["Chascar la patata (cortar un poco y romper) suelta almidón y espesa la salsa sin harina.","Si la sepia sigue dura, 10 min más tapado: se ablanda con la cocción larga.","La cebolla congelada vale: va directa a la cazuela, 2 min más para que se evapore el agua.","Mejor hecho la víspera: los guisos ganan de un día para otro."],"use":["A mar"]},{"id":"lentejas-con-contramuslo-y-verduras","t":"Lentejas con contramuslo y verduras","cat":"Comida","meta":"Batch · 1 olla para miércoles y jueves · 40 min","cond":"sal, pimentón dulce, comino, 1 hoja de laurel","ing":[["lentejas de bote (escurridas)","200 g","50 g"],["contramuslo de pollo","95 g","70 g"],["zanahoria","60 g","60 g"],["pimiento rojo","40 g","40 g"],["tomate triturado","70 g","70 g"],["mandarinas","1 u","2 u"],["patata","—","150 g"]],"oil":"1 cucharada sopera (≈13 g)","s":["Es una olla para dos días: el miércoles la come Mario y el jueves los dos (Natalia, el miércoles, come pollo con arroz). Enjuaga muy bien 450 g de LENTEJAS de bote en un colador, hasta que no salga espuma.","Cazuela con la mitad del aceite a vitro 8: 260 g de CONTRAMUSLO en dados, 5 min, hasta que estén dorados. Sácalos.","Baja a vitro 5, el resto del aceite: 180 g de ZANAHORIA en dados pequeños, 5 min. Luego 120 g de PIMIENTO, 4 min.","210 g de TOMATE triturado, 3 min. Fuera del fuego, pimentón y comino (una pizca de cada), y remueve.","Vuelve el pollo, unos 600 ml de agua, 1 hoja de laurel y la PATATA de Natalia en dados (150 g). Cuando hierva, vitro 4, tapa y 15-20 min, hasta que la patata esté tierna.","Añade las LENTEJAS y 10 min más sin tapa a vitro 4, para que espese. Prueba y ajusta la sal.","Reparte: el miércoles, Mario 200 g de lentejas; el jueves, Mario 200 g y Natalia 50 g con su patata. Las raciones del jueves, mejor al congelador."],"tips":["Las lentejas de bote ya están cocidas: si hierven mucho rato se deshacen. Siempre al final.","Enjuagarlas quita parte de los FODMAP (pasan al líquido del bote): le sientan mejor a Natalia.","El comino ayuda a la digestión de la legumbre y le da sabor sin cebolla.","Aguantan 3-4 días en la nevera; al calentar, un chorrito de agua."],"use":["A mié","A jue"]},{"id":"wok-de-cerdo-con-arroz-integral-brocoli-y-verduras","t":"Wok de cerdo con arroz basmati, brócoli y verduras","cat":"Comida","meta":"Viernes A · 25 min","cond":"pimienta, jengibre, salsa de soja tamari (sin sal añadida)","ing":[["cerdo magro","240 g","160 g"],["arroz basmati (seco)","60 g","70 g"],["pimiento congelado","80 g","80 g"],["calabacín","80 g","80 g"],["zanahoria","60 g","60 g"],["brócoli (solo ramilletes)","80 g","60 g"]],"oil":"1 cucharada sopera (≈16 g)","s":["ARROZ basmati cocido: del batch (congelado; sácalo la noche antes) o 130 g en seco según el paquete.","400 g de CERDO en tiras finas y secas. Wok o sartén grande a vitro 9 con un tercio del aceite: el cerdo 3-4 min sin removerlo mucho, que se dore. Sácalo.","Baja a vitro 7, el resto del aceite: 120 g de ZANAHORIA en bastones finos, 3 min.","140 g de BRÓCOLI (solo ramilletes; congelado, sin descongelar) con 2 cucharadas soperas de agua. Tapa 4 min.","Destapa: 160 g de PIMIENTO congelado y 160 g de CALABACÍN en medias lunas, 3 min a vitro 8, removiendo.","Vuelve el cerdo y el arroz, 1 cucharada sopera de soja tamari y una pizca de jengibre: 2 min removiendo sin parar. Reparte según la tabla."],"tips":["Fuego fuerte y en tandas: si se amontona, cuece en vez de saltear.","El chorrito de agua con tapa hace el brócoli al vapor en 4 min y queda crujiente.","Corta el cerdo a contraveta (perpendicular a las fibras): queda más tierno.","Salsa de soja tamari Kikkoman sin gluten: de 1 cucharilla pequeña (de café) a 1 cucharada sopera para el plato de los dos. 1 cucharada sopera ≈ 2,5 g de sal: ese día, no añadas sal."],"use":["A vie"]},{"id":"calamares-a-la-sarten-con-patata-y-ensalada","t":"Calamares a la sartén con patata y ensalada","cat":"Comida","meta":"Domingo B · 25 min","cond":"sal, ajo, perejil, limón","ing":[["calamar limpio","220 g","180 g"],["patata","180 g","250 g"],["ensalada de bolsa","60 g","60 g"],["tomate","150 g","150 g"]],"oil":"1 cucharada sopera y media (≈21 g)","s":["430 g de PATATA en dados en un recipiente con 2 cucharadas soperas de agua, tapada al microondas 8-10 min (remueve a mitad), hasta que se pinche fácil.","Seca MUY bien 400 g de CALAMAR en anillas con papel de cocina (si está mojado, cuece en vez de dorarse).","Sartén grande con parte del aceite a vitro 9. Para Natalia: 1 diente de ajo laminado 1 min, hasta dorado, y fuera.","Calamar 2-3 min, removiendo; no más, que se endurece. Sal, perejil y unas gotas de limón al final.","En la misma sartén, la patata 3 min para que se dore un poco. Ensalada con el tomate y el resto del aceite."],"tips":["Más de 3 min y el calamar se vuelve chicle: o muy poco o muy largo (guiso).","Si suelta agua, sácalo, deja que la sartén vuelva a calentar y termina en dos tandas."],"use":["B dom"]},{"id":"estofado-de-pollo-con-arroz","t":"Estofado de pollo con arroz","cat":"Comida","meta":"Lunes B · batch · 1 olla para 2 días · 45 min","cond":"sal, pimienta, pimentón, tomillo, 1 hoja de laurel","ing":[["patata","60 g","100 g"],["arroz basmati (seco)","45 g","55 g"],["zanahoria","80 g","80 g"],["pimiento rojo","50 g","50 g"],["tomate triturado","60 g","60 g"],["mandarinas","1 u","2 u"],["contramuslo de pollo","200 g","130 g"]],"oil":"1 cucharada sopera (≈13 g)","s":["Es una olla para dos días: lunes (con arroz) y miércoles (con más patata). Cantidades de la olla: 660 g de contramuslo, 320 g de zanahoria, 200 g de pimiento, 240 g de tomate triturado y 530 g de patata.","Cazuela con la mitad del aceite a vitro 8: el CONTRAMUSLO en dados, 5-6 min, hasta dorado. Sácalo.","Vitro 5, el resto del aceite: la ZANAHORIA en dados, 5 min. Luego el PIMIENTO, 4 min.","TOMATE triturado, pimentón y tomillo, 3 min.","Vuelve el pollo, toda la PATATA en trozos, 1 hoja de laurel y agua hasta cubrir. Cuando hierva, vitro 4, tapa y 25-30 min, hasta que la patata se pinche fácil.","Aparte, 100 g de ARROZ basmati en seco según el paquete (55 g Natalia + 45 g Mario).","Lunes: estofado con arroz y un poco de patata. El resto, a un táper para el miércoles (aguanta en la nevera)."],"tips":["Dorar bien el pollo al principio es lo que da el sabor al caldo.","Si queda caldoso, destapa los últimos 10 min.","Mandarina de postre los dos días."],"use":["B lun"]},{"id":"estofado-de-pollo-con-patata","t":"Estofado de pollo con patata","cat":"Comida","meta":"Miércoles B · de la olla del lunes","cond":"sal, pimienta, pimentón, tomillo, 1 hoja de laurel","ing":[["patata","150 g","220 g"],["zanahoria","80 g","80 g"],["pimiento rojo","50 g","50 g"],["tomate triturado","60 g","60 g"],["mandarinas","1 u","2 u"],["contramuslo de pollo","200 g","130 g"]],"oil":"1 cucharada sopera (≈13 g)","s":["Sale de la olla del lunes (ver «Estofado de pollo con arroz»): no hay que cocinar.","Calienta tu ración en un cazo a vitro 5, tapada, 5-6 min removiendo, o al microondas 2-3 min tapada, removiendo a mitad.","Tiene que quedar bien caliente por dentro. Si la salsa se ha espesado, un chorrito de agua."],"tips":["Dorar bien el pollo al principio es lo que da el sabor al caldo.","Si queda caldoso, destapa los últimos 10 min.","Mandarina de postre los dos días."],"use":["B mié"]},{"id":"pisto-con-atun-huevo-y-arroz-integral","t":"Pisto con atún, huevo y arroz basmati","cat":"Comida","meta":"Martes B · 45 min","cond":"sal, orégano, una pizca de azúcar si el tomate está ácido","ing":[["arroz basmati (seco)","55 g","60 g"],["calabacín","75 g","75 g"],["pimiento rojo","80 g","80 g"],["berenjena","45 g","45 g"],["tomate triturado","100 g","100 g"],["atún al natural","1 lata","1 lata"],["huevos","1 u","1 u"]],"oil":"1 cucharada sopera (≈14 g)","s":["ARROZ basmati: 115 g en seco (55 g Mario + 60 g Natalia) en agua con sal a vitro 6 lo que diga el paquete; o el del batch.","Cuece 2 HUEVOS 10 min en agua hirviendo (vitro 8), a agua fría y pélalos.","Corta en dados de 1-2 cm: 160 g de PIMIENTO, 90 g de BERENJENA y 150 g de CALABACÍN, por separado (cada uno entra en un momento).","Sartén grande con el aceite a vitro 5: el PIMIENTO 8 min, removiendo de vez en cuando.","Añade la BERENJENA, 8 min (se bebe el aceite al principio: no añadas más, suelta después).","Añade el CALABACÍN, 5 min, hasta que todo esté blando.","200 g de TOMATE triturado, sal y orégano. Baja a vitro 4 y 10-15 min, hasta que espese y no quede agua. Si está ácido, una pizca de azúcar.","Sirve a cada uno: su arroz, la mitad del pisto, 1 lata de atún escurrida y 1 huevo en cuartos."],"tips":["Cada verdura entra cuando la anterior ya está blanda: así no queda nada crudo ni nada deshecho.","La berenjena con sal 10 min antes y secada absorbe menos aceite.","Mejor de un día para otro."],"use":["B mar"]},{"id":"garbanzos-con-pollo-y-verduras","t":"Garbanzos con pollo y verduras","cat":"Comida","meta":"Jueves B · batch · 35 min","cond":"sal, pimentón, comino, 1 hoja de laurel","ing":[["garbanzos de bote (escurridos)","150 g","—"],["pechuga de pollo","170 g","—"],["zanahoria","100 g","—"],["patata","90 g","—"],["tomate triturado","60 g","—"],["mandarinas","1 u","—"]],"oil":"1 cucharilla pequeña (de café)","s":["Es solo para Mario: Natalia come ese día pollo al limón con arroz basmati y judías verdes. Enjuaga muy bien 150 g de GARBANZOS de bote en un colador.","Cazuela con la mitad del aceite a vitro 8: 170 g de PECHUGA en dados, 4-5 min, hasta dorada. Sácala (si se hace mucho, queda seca).","Vitro 5, el resto del aceite: 100 g de ZANAHORIA en rodajas, 5 min. En el batch, la zanahoria y el tomate salen del sofrito común.","90 g de PATATA en dados y 60 g de TOMATE triturado, 2 min. Fuera del fuego, pimentón y comino.","Agua hasta cubrir y 1 hoja de laurel. Cuando hierva, vitro 4, tapa y 15-20 min, hasta que la patata se pinche fácil.","Los garbanzos y el pollo de vuelta, 5-8 min más a vitro 4. Al táper del jueves, mejor al congelador (ya son 4 días)."],"tips":["La pechuga vuelve al final para que no se seque en el guiso.","Del congelador a la nevera la noche del miércoles."],"use":["B jue"]},{"id":"arroz-salteado-con-gambas-y-verduras","t":"Arroz salteado con gambas y verduras","cat":"Comida","meta":"Viernes B · 25 min","cond":"ajo solo para el aceite, jengibre, salsa de soja tamari (sin sal añadida), cebollino","ing":[["arroz basmati (seco)","65 g","75 g"],["gamba pelada congelada","200 g","140 g"],["pimiento congelado","60 g","60 g"],["calabacín","80 g","80 g"],["zanahoria","50 g","50 g"]],"oil":"1 cucharada sopera (≈16 g)","s":["El arroz tiene que estar cocido y FRÍO (mejor del día anterior): 140 g en seco, cocido según el paquete y a la nevera extendido.","340 g de GAMBAS descongeladas (la noche antes en la nevera) y muy secas con papel.","Sartén grande o wok a vitro 9 con un tercio del aceite. Para Natalia, el ajo solo para aromatizar 1 min y fuera. Gambas 2 min, hasta que estén rosadas. Sácalas.","Vitro 7, el resto del aceite: 100 g de ZANAHORIA en dados pequeños, 3-4 min.","160 g de CALABACÍN en dados y 120 g de PIMIENTO congelado, 3 min.","Vitro 9: el arroz frío, 3-4 min sin parar de remover, que se suelte y se tueste un poco. Vuelven las gambas y 1 cucharada sopera de soja tamari, 1 min."],"tips":["Con arroz recién hecho sale pastoso: frío de nevera se separa grano a grano.","Gambas más de 2-3 min = gomosas.","Salsa de soja tamari Kikkoman sin gluten: de 1 cucharilla pequeña (de café) a 1 cucharada sopera para el plato de los dos. 1 cucharada sopera ≈ 2,5 g de sal: ese día, no añadas sal."],"use":["B vie"]},{"id":"pollo-a-la-sarten-con-verduras-salteadas","t":"Pollo a la sartén con verduras salteadas","cat":"Comida","meta":"Domingo A · 20 min","cond":"sal (poca), pimienta, orégano, salsa de soja tamari, limón","ing":[["pechuga de pollo","200 g","180 g"],["calabacín","150 g","150 g"],["pimiento rojo","100 g","100 g"],["zanahoria","80 g","80 g"],["pan 100 % integral","50 g","—"],["pan de arroz","—","60 g"]],"oil":"1 cucharada sopera y media (≈17 g)","s":["Corta la verdura en tiras: 160 g de ZANAHORIA en bastones finos, 200 g de PIMIENTO y 300 g de CALABACÍN.","Sartén grande con parte del aceite a vitro 6: la ZANAHORIA tapada 5 min (así se hace por dentro).","Destapa, vitro 7: el PIMIENTO 4 min y luego el CALABACÍN 3-4 min. Sal al final.","En otra sartén a vitro 8 con el resto del aceite: 380 g de PECHUGA en filetes, 3-4 min por lado, hasta que no quede rosa.","1 cucharilla pequeña de soja tamari en las verduras, 30 s removiendo, y unas gotas de limón al pollo.","Mario con pan integral; Natalia con pan de arroz."],"tips":["No muevas el pollo el primer minuto: se dora y se despega solo.","La sal en la verdura al final: si la pones al principio, suelta agua y no se dora.","Salsa de soja tamari Kikkoman sin gluten: de 1 cucharilla pequeña (de café) a 1 cucharada sopera para el plato de los dos. 1 cucharada sopera ≈ 2,5 g de sal: ese día, no añadas sal."],"use":["A dom"]},{"id":"salmon-con-patata-y-judias-verdes","t":"Salmón con patata y judías verdes","cat":"Cena","meta":"Cena · 20 min","cond":"pimienta, eneldo, limón, unas gotas de soja tamari (opcional)","ing":[["salmón (1 lomo)","125 g","125 g"],["patata","180 g","220 g"],["judías verdes congeladas","150 g","150 g"]],"oil":"½ cucharada sopera (≈9 g)","s":["400 g de PATATA en dados y 300 g de JUDÍAS verdes congeladas en un recipiente con 3 cucharadas soperas de agua, tapado al microondas 10-12 min (remueve a mitad), o hervidas 12-15 min a vitro 7.","Seca los 2 lomos de SALMÓN con papel. Sartén antiadherente con el aceite a vitro 6.","Salmón por el lado de la piel (o el más plano) 4 min sin moverlo; vuelta y 2-3 min. Está hecho cuando se separa en láminas y el centro aún está jugoso.","Sal y limón al final. Un hilo de aceite por encima de la verdura."],"tips":["Saca el salmón del congelador a la nevera la noche antes.","Si lo tocas antes de 3-4 min, se rompe: espera a que se despegue solo.","Salsa de soja tamari Kikkoman sin gluten: de 1 cucharilla pequeña (de café) a 1 cucharada sopera para el plato de los dos. 1 cucharada sopera ≈ 2,5 g de sal: ese día, no añadas sal."],"use":["A lun"]},{"id":"salmon-con-boniato-y-judias-verdes","t":"Salmón con boniato y judías verdes","cat":"Cena","meta":"Cena · 20 min","cond":"sal, pimienta, eneldo o limón","ing":[["salmón (1 lomo)","125 g","125 g"],["boniato","180 g","220 g"],["judías verdes congeladas","150 g","150 g"]],"oil":"½ cucharada sopera (≈9 g)","s":["BONIATO: en su bolsa al microondas el tiempo que indique, o 400 g en dados tapados con un poco de agua 8-10 min, hasta que se pinche fácil.","300 g de JUDÍAS verdes congeladas: hervidas 8-10 min a vitro 7, o al microondas tapadas 8 min.","Sartén antiadherente con el aceite a vitro 6: SALMÓN 4 min por un lado y 2-3 por el otro.","Sal, eneldo o limón al final."],"tips":["Saca el salmón del congelador a la nevera la noche antes.","Si lo tocas antes de 3-4 min, se rompe: espera a que se despegue solo."],"use":["B lun"]},{"id":"salmon-con-patata-y-ensalada-de-col-rizada","t":"Salmón con patata y ensalada de tomate, olivas y atún","cat":"Cena","meta":"Cena · 20 min","cond":"sal, pimienta, eneldo o limón","ing":[["salmón (1 lomo)","125 g","125 g"],["patata","180 g","220 g"],["tomate","150 g","150 g"],["olivas verdes","15 g","10 g"],["garbanzos de bote (escurridos)","60 g","—"],["atún al natural","1 lata","1 lata"]],"oil":"½ cucharada sopera (≈9 g)","s":["400 g de PATATA en dados al microondas tapada con 2 cucharadas soperas de agua, 8-10 min.","Ensalada de tomate, olivas y atún (ver su ficha). Mario: + 60 g de garbanzos enjuagados.","Sartén antiadherente con el aceite a vitro 6: SALMÓN 4 min por un lado y 2-3 por el otro. Sal y limón."],"tips":["Saca el salmón del congelador a la nevera la noche antes.","Si lo tocas antes de 3-4 min, se rompe: espera a que se despegue solo."],"use":["B vie"]},{"id":"pasta-con-salmon-calabacin-y-tomate","t":"Pasta con salmón, calabacín y tomate","cat":"Cena","meta":"Viernes A · 25 min","cond":"sal, pimienta, albahaca u orégano","ing":[["pasta sin gluten (seca)","65 g","65 g"],["salmón (1 lomo)","125 g","125 g"],["calabacín","250 g","250 g"],["tomate triturado","80 g","80 g"]],"oil":"1 cucharada sopera (≈13 g)","s":["Agua (unos 1,5 litros) con sal a vitro 9. Cuando hierva, 130 g de PASTA sin gluten y baja a vitro 7. Al dente: 1-2 min menos de lo que diga el paquete.","Mientras, sartén grande con el aceite a vitro 7: 500 g de CALABACÍN en dados, 5 min, hasta que empiece a dorarse.","250 g de SALMÓN sin piel en dados, 2-3 min, con cuidado de no romperlo.","Baja a vitro 4: 160 g de TOMATE triturado, sal y albahaca u orégano, 5 min.","Escurre la pasta (guarda un chorrito del agua) y mézclala con la salsa 1 min a vitro 3. Mitad y mitad."],"tips":["Guarda medio vaso del agua de la pasta: un chorrito liga la salsa.","La pasta sin gluten se pasa rápido: mejor al dente."],"use":["A vie"]},{"id":"merluza-con-patata-y-calabacin","t":"Merluza con patata y calabacín","cat":"Cena","meta":"Miércoles A · cena · 30 min","cond":"sal, perejil, limón, ajo solo para el aceite","ing":[["merluza congelada","230 g","170 g"],["patata","180 g","250 g"],["calabacín","200 g","200 g"]],"oil":"1 cucharada sopera (≈13 g)","s":["La MERLUZA congelada, mejor descongelada la noche antes en la nevera. Sécala bien con papel.","430 g de PATATA en dados o gajos, tapada al microondas 6-8 min, hasta que se pueda pinchar.","Sartén grande con la mitad del aceite a vitro 7: la patata 4-5 min, hasta que se dore un poco. Añade 400 g de CALABACÍN en rodajas, 4 min, sal. Aparta a un lado o a un plato.","Para Natalia: un diente de ajo laminado en el resto del aceite 1 min y fuera.","MERLUZA a vitro 6: 3-4 min por lado, hasta que se separe en láminas. Perejil y limón."],"tips":["Patata en rodajas finas (½ cm): así se hace en el mismo tiempo que el pescado."],"use":["A mié"]},{"id":"dorada-con-patata-y-calabacin","t":"Dorada con patata y calabacín","cat":"Cena","meta":"Miércoles B · cena · 30 min","cond":"sal, perejil, limón, ajo solo para el aceite","ing":[["dorada en filetes","230 g","170 g"],["patata","180 g","250 g"],["calabacín","200 g","200 g"]],"oil":"1 cucharada sopera (≈13 g)","s":["430 g de PATATA en dados o gajos, tapada al microondas 6-8 min, hasta que se pueda pinchar.","Sartén grande con la mitad del aceite a vitro 7: la patata 4-5 min, hasta que se dore. Añade 400 g de CALABACÍN en rodajas, 4 min, sal. Aparta.","Seca bien los filetes de DORADA. Resto del aceite a vitro 7, la piel hacia abajo 3-4 min, apretando suave con la espátula el primer minuto para que no se curve, hasta que la piel esté crujiente.","Vuelta, 1 min y listo. Sal, perejil y limón."],"tips":["Patata en rodajas finas (½ cm): así se hace en el mismo tiempo que el pescado.","Pedid que os la limpien y saquen en filetes. Fresca: 1-2 días en la nevera o al congelador.","Haz 2-3 cortes en la piel: así no se encoge en la sartén."],"use":["B mié"]},{"id":"sepia-a-la-sarten-con-patatas-y-ensalada","t":"Sepia a la sartén con patatas y ensalada","cat":"Cena","meta":"Jueves B · cena · 25 min","cond":"ajo solo para el aceite, perejil, limón, unas gotas de soja tamari (opcional)","ing":[["sepia limpia","350 g","250 g"],["patata","180 g","250 g"],["ensalada de bolsa","60 g","60 g"],["tomate","150 g","150 g"],["mandarinas","1 u","2 u"]],"oil":"1 cucharada sopera y media (≈21 g)","s":["430 g de PATATA en dados al microondas tapada con 2 cucharadas soperas de agua, 8-10 min.","600 g de SEPIA en tiras, muy seca con papel de cocina.","Sartén grande con parte del aceite a vitro 9. Para Natalia, el ajo solo para dorar el aceite 1 min y fuera.","Sepia 3-4 min, removiendo, hasta que esté blanca y algo dorada. Si es mucha, en dos tandas (si no, suelta agua y se cuece). Perejil y limón.","Ensalada y tomate con el resto del aceite."],"tips":["Sepia congelada: descongélala en la nevera la noche antes y sécala bien.","Salsa de soja tamari Kikkoman sin gluten: de 1 cucharilla pequeña (de café) a 1 cucharada sopera para el plato de los dos. 1 cucharada sopera ≈ 2,5 g de sal: ese día, no añadas sal."],"use":["B jue"]},{"id":"ensalada-de-patata-atun-y-judias","t":"Ensalada de patata, atún y judías","cat":"Cena","meta":"Sábado A · cena · 20 min","cond":"sal, vinagre, orégano","ing":[["patata","150 g","220 g"],["atún al natural","1 lata","1 lata"],["judías verdes congeladas","150 g","150 g"],["tomate","150 g","150 g"],["garbanzos de bote (escurridos)","60 g","—"]],"oil":"1 cucharada sopera (≈16 g)","s":["370 g de PATATA en dados y 300 g de JUDÍAS verdes congeladas, tapadas al microondas con 3 cucharadas soperas de agua 10-12 min, o hervidas 12-15 min a vitro 7. A enfriar extendidas en un plato.","300 g de TOMATE en trozos. Atún escurrido: 1 lata cada uno. Mario: + 60 g de garbanzos enjuagados.","Aliña con el aceite, un chorrito de vinagre, orégano y sal."],"tips":["Hecha a mediodía y a la nevera, está mejor fría."],"use":["A sáb"]},{"id":"tortilla-de-calabacin-con-ensalada-de-col-rizada","t":"Tortilla de calabacín con ensalada de tomate, olivas y atún","cat":"Cena","meta":"Martes A · cena · 20 min","cond":"sal","ing":[["huevos","2 u","2 u"],["calabacín","150 g","150 g"],["tomate","150 g","150 g"],["pan 100 % integral","50 g","—"],["olivas verdes","15 g","10 g"],["atún al natural","1 lata","1 lata"],["pan de arroz","—","60 g"]],"oil":"1 cucharada sopera (≈16 g)","s":["300 g de CALABACÍN en dados pequeños. Sartén de unos 20-22 cm con parte del aceite a vitro 5: 8-10 min, hasta que esté blando y sin agua.","Bate los 4 HUEVOS con sal y mezcla con el calabacín escurrido de aceite.","Misma sartén con un hilo de aceite a vitro 4: echa la mezcla, 3-4 min, hasta que los bordes estén cuajados.","Vuelta con un plato (tapa la sartén con el plato, dale la vuelta y deslízala otra vez) y 2 min más.","Reparto: Mario algo más de la mitad. Ensalada de tomate, olivas y atún, y pan (integral Mario, de arroz Natalia)."],"tips":["Si el calabacín aún suelta agua, la tortilla queda aguada: que esté bien seco."],"use":["A mar"]},{"id":"tortilla-de-patata-con-ensalada-de-col-rizada","t":"Tortilla de patata con ensalada de tomate, olivas y atún","cat":"Cena","meta":"Martes B · cena · 35 min","cond":"sal","ing":[["huevos","2 u","2 u"],["patata","150 g","200 g"],["tomate","150 g","150 g"],["olivas verdes","15 g","10 g"],["atún al natural","1 lata","1 lata"]],"oil":"1 cucharada sopera (≈13 g)","s":["350 g de PATATA en láminas finas en un bol con la mitad del aceite y sal. Microondas tapada 8-10 min, removiendo a mitad, hasta que esté tierna.","Bate los 4 HUEVOS, mezcla con la patata y deja reposar 5 min (así la patata coge el huevo).","Sartén de unos 20-22 cm con el resto del aceite a vitro 4: echa la mezcla, 4-5 min.","Vuelta con un plato y 2-3 min más (más tiempo si la queréis bien cuajada).","Ensalada de tomate con olivas y la lata de atún."],"tips":["Los 5 min de reposo hacen que la patata absorba huevo: queda más jugosa.","Así no se fríe la patata en mucho aceite y queda igual de tierna."],"use":["B mar"]},{"id":"m-revuelto-con-calabacin-y-ensalada-n-crema-de-calabaza-con-","t":"M: revuelto con calabacín y ensalada / N: crema de calabaza con revuelto","cat":"Cena","meta":"Domingo B · cena · 15 min","cond":"sal, pimienta","ing":[["huevos","2 u","2 u"],["calabacín","150 g","—"],["pan 100 % integral","50 g","—"],["tomate","150 g","—"],["ensalada de bolsa","50 g","—"],["pan de arroz","—","50 g"],["crema de calabaza Bonpreu","—","1 envase"]],"oil":"1 cucharilla pequeña (de café) y media (≈6 g)","s":["Mario: 150 g de CALABACÍN en dados con un hilo de aceite a vitro 6, 6-8 min.","Baja a vitro 4, echa 2 huevos batidos con sal y remueve sin parar hasta que cuajen, 1-2 min. Ensalada con tomate y pan integral.","Natalia: la crema de calabaza en un cazo a vitro 5 (5 min removiendo) o al microondas tapada 2-3 min. 2 huevos revueltos o a la sartén, con pan de arroz."],"tips":["Revuelto: fuera del fuego cuando aún brille un poco; termina de cuajar en el plato."],"use":["B dom"]},{"id":"m-tortilla-francesa-con-ensalada-n-crema-de-calabacin-con-to","t":"M: tortilla francesa con ensalada / N: crema de calabacín con tortilla","cat":"Cena","m function countShop(wk){ let all = 0, done = 0; DATA.shop[wk].forEach((g) => g.items.forEach((it) => { all++; if (S.checks[wk][it.k]) done++; })); return {all, done}; }
function swapItems(wk){
  const out = [];
  Object.keys(S.swaps[wk]).forEach((key) => { const [day, mi] = key.split('-').map(Number); const sw = swapAt(wk, day, mi); if (!sw) return;
    sw.ing.forEach((i, ix) => out.push({k: 'cambio-' + key + '-' + ix, n: i[0], d: sw.t + ' · ' + DATA.weeks[wk][day].d.toLowerCase(), q: 'M ' + i[1] + ' · N ' + i[2]})); });
  return out;
}
function vLista(){
  const wk = S.week; const other = wk === 'A' ? 'B' : 'A';
  const c = countShop(wk);
  let groups;
  if (S.mode === 'cat') groups = DATA.shop[wk].map((g, gi) => ({id: 'c' + gi, g: g.g, items: g.items}));
  else {
    const map = {};
    DATA.shop[wk].forEach((g) => g.items.forEach((it) => { (it.r.length ? it.r : ['_otros']).forEach((rid) => { (map[rid] = map[rid] || []).push(it); }); }));
    groups = Object.keys(map).map((rid) => ({id: 'r' + rid, g: rid === '_otros' ? 'Desayunos, meriendas y despensa' : (recById(rid) ? recById(rid).t : rid), items: map[rid]}));
  }
  const sx = swapItems(wk);
  if (sx.length) groups.unshift({id: 'swaps', g: 'Para los platos cambiados', items: sx});
  let h = backTo('inicio', 'Lista de la compra')
    + '<div class="weekbar"><b style="flex:1">Semana ' + wk + ' · ' + c.done + ' de ' + c.all + '</b><button class="wk" data-week="' + other + '">Semana ' + other + '</button></div>'
    + '<div class="sync' + (S.live ? ' live' : '') + '"><i></i>' + 'Guardado en este móvil: de momento las marcas no se comparten' + '</div>'
    + '<div class="seg"><button class="' + (S.mode === 'cat' ? 'on' : '') + '" data-mode="cat">Por categorías</button><button class="' + (S.mode === 'rec' ? 'on' : '') + '" data-mode="rec">Por receta</button></div>';
  if (sx.length) h += '<p class="muted" style="font-size:12.5px;margin:0 0 6px">Habéis cambiado algún plato: arriba está lo que necesita. Lo del plato original que ya tengáis os sirve para otro día.</p>';
  h += groups.map((g) => {
    const open = !S.closed[g.id]; const d = g.items.filter((it) => S.checks[wk][it.k]).length;
    return '<div class="grp"><button class="grp-h" data-grp="' + esc(g.id) + '" aria-expanded="' + open + '"><span class="cb' + (d === g.items.length ? ' on' : '') + '">' + (d === g.items.length ? IC.check : '') + '</span><span style="flex:1">' + emo(g.g) + esc(g.g) + '</span><span class="c">' + d + '/' + g.items.length + '</span><span aria-hidden="true">' + (open ? '⌃' : '⌄') + '</span></button>'
      + (open ? g.items.map((it) => { const on = !!S.checks[wk][it.k];
        return '<button class="it' + (on ? ' on' : '') + '" data-item="' + esc(it.k) + '" aria-pressed="' + on + '"><span class="cb">' + (on ? IC.check : '') + '</span><span class="nm"><b>' + esc(it.n) + '</b><small>' + esc(it.d) + '</small></span><span class="q">' + esc(it.q) + '</span></button>'; }).join('') : '') + '</div>';
  }).join('');
  h += '<div style="display:flex;flex-direction:column;gap:8px;margin-top:16px">'
    + (c.done < c.all ? '<button class="btn primary block" data-markall>Marcar todo como comprado</button>' : '')
    + (c.done > 0 ? '<button class="btn block" data-reset>Empezar la compra de nuevo</button>' : '') + '</div>';
  if (S.confirm === 'reset') h += '<div class="confirm card" style="padding:10px 12px">¿Quitar todas las marcas de la semana ' + wk + '? <button class="btn danger" data-reset-yes>Sí, quitar</button><button class="btn" data-cancel>No</button></div>';
  return h;
}

  if (d.mview) { S.mview = d.mview; render(); return window.scrollTo(0, 0); }
  if (d.goday) { const g = d.goday.split('|'); S.week = g[0]; S.day = +g[1]; S.mview = 'dia'; if (S.view !== 'menu') return go('menu'); render(); return window.scrollTo(0, 0); }
  if (d.cambiar) { S.altSlot = S.week + '|' + d.cambiar; S.altSel = null; return go('recetas'); }
  if (d.altslot) { S.altSlot = d.altslot; S.altSel = null; return render(); }
  if (d.altsel) { const open = S.altSel === d.altsel || (!S.altSel && b.getAttribute('aria-expanded') === 'true'); S.altSel = open ? 'none' : d.altsel; return render(); }
  if (d.who) { S.who = d.who; store.set('who', d.who); return render(); }
  if (d.rec !== undefined) return go('receta', {prev: S.view === 'receta' ? S.prev : S.view, rec: d.rec, step: 0, ctx: d.ctxid || d.ctx || null});
  if (d.rectab) { S.recTab = d.rectab; return render(); }
  if (d.swapopen) { S.swapOpen = S.swapOpen === d.swapopen ? null : d.swapopen; return render(); }
  if (d.swap) { const [key, id] = d.swap.split('|'); S.swapOpen = null; return writeSwap(key, id); }
  if (d.unswap) return writeSwap(d.unswap, null);
  if (d.dreac) { dFormSync(); S.dForm.r = d.dreac; return render(); }
  if (d.dsint) { dFormSync(); S.dForm.s[d.dsint] = !S.dForm.s[d.dsint]; return render(); }
  if (d.ddel) { S.confirm = 'd:' + d.ddel; return render(); }
  if (d.ddelYes) { S.confirm = null; render(); return db.doc('diario/' + d.ddelYes).delete().then(() => toast('Borrado')).catch(() => toast('No se pudo borrar.')); }
  if (d.bwk) { S.bwk = d.bwk; S.bsheet = null; return render(); }
  if (d.bph) { S.bph = d.bph; S.bsheet = null; render(); return window.scrollTo(0, 0); }
  if (d.bwho) { S.bwho = d.bwho; return render(); }
  if (d.bsheet !== undefined) { S.bsheet = +d.bsheet; return render(); }
  if ('bsheetx' in d) { S.bsheet = null; return render(); }
  if (d.bck !== undefined) return toggleB(d.bck);
  if (d.mdone) return toggleMealDone(d.mdone);
  if (d.timer) { const [mn, ...lb] = d.timer.split('|'); return startTimer(lb.join('|'), +mn); }
  if (d.tcancel) { const k = TIMERS.findIndex((t) => String(t.id) === d.tcancel); if (k >= 0) TIMERS.splice(k, 1); return drawTimers(); }
  if (d.tplus) { const t = TIMERS.find((x) => String(x.id) === d.tplus); if (t) t.end += 60000; return drawTimers(); }
  if ('breset' in d) { S.confirm = 'breset'; return render(); }
  if ('bresetYes' in d) return resetSteps();
  if ('back' in d) return go(S.prev === 'receta' ? (S.prev === 'recetas' ? 'recetas' : 'inicio') : S.prev);
  if (d.filt) { S.filt = d.filt; return render(); }
  if (d.ft) { S.ft = d.ft; S.fq = ''; return render(); }
  if ('fmenu' in d) { S.fmenu = !S.fmenu; return render(); }
  if (d.rw) { S.rw = d.rw; return render(); }
  if ('cook' in d) { S.cook = true; S.step = 0; render(); return window.scrollTo(0, 0); }
  if ('uncook' in d) { S.cook = false; return render(); }
  if ('prev' in d) { S.step = Math.max(0, S.step - 1); return render(); }
  if ('next' in d) { const r = recById(S.rec); if (S.step >= r.s.length - 1) { S.cook = false; toast('Receta terminada'); } else S.step++; return render(); }
  if (d.mode) { S.mode = d.mode; return render(); }
  if (d.grp) { S.closed[d.grp] = !S.closed[d.grp]; return render(); }
  if (d.item) return toggleItem(d.item);
  if ('markall' in d) return markAll();
  if ('reset' in d) { S.confirm = 'reset'; return render(); }
  if ('resetYes' in d) return resetWeek();
  if ('cancel' in d) { S.confirm = null; return render(); }
  if ('photo' in d) return $('#photo-input').click();
  if ('delphoto' in d) { S.confirm = 'delphoto'; return render(); }
  if ('delphotoYes' in d) return deletePhoto();
});
document.addEventListener('submit', (e) => {
  e.preventDefault();
  if (e.target.id === 'f-diario') return addDiario();
});
document.addEventListener('input', (e) => { if (e.target.id === 'q') { S.q = e.target.value; S._focusQ = true; render(); S._focusQ = false; } if (e.target.id === 'fq') { S.fq = e.target.value; S._focusF = true; render(); S._focusF = false; } });

/* ---------- compra compartida ---------- */
function writeChecks(wk, patch){
  Object.assign(S.checks[wk], patch);
  Object.keys(patch).forEach((k) => { if (!patch[k]) delete S.checks[wk][k]; });
  render();
  if (!db) return;
  db.doc('compra/semana-' + wk).set(Object.assign({}, S.checks[wk])).catch(() => toast('No se pudo guardar. Revisa la conexión.'));
}
function toggleItem(k){ const wk = S.week; writeChecks(wk, {[k]: !S.checks[wk][k]}); }
function markAll(){ const wk = S.week; const p = {}; DATA.shop[wk].forEach((g) => g.items.forEach((it) => { p[it.k] = true; })); writeChecks(wk, p); toast('Todo marcado como comprado'); }
function resetWeek(){ const wk = S.week; S.checks[wk] = {}; S.confirm = null; render(); if (db) db.doc('compra/semana-' + wk).set({}).catch(() => toast('No se pudo guardar. Revisa la conexión.')); toast('Lista de la semana ' + wk + ' sin marcas'); }

/* ---------- cambios de plato ---------- */
function writeSwap(key, id){
  const wk = S.week; const next = Object.assign({}, S.swaps[wk]);
  if (id) next[key] = id; else delete next[key];
  S.swaps[wk] = next; render(); toast(id ? 'Plato cambiado' : 'Plato original de nuevo');
  if (db) db.doc('cambios/semana-' + wk).set(next).catch(() => toast('No se pudo guardar. Revisa la conexión.'));
}
/* ---------- fotos ---------- */
function toJpeg(file, maxSide){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => { const max = maxSide || 1600; let w = img.naturalWidth, h = img.naturalHeight; const s = Math.min(1, max / Math.max(w, h)); w = Math.round(w * s); h = Math.round(h * s);
      const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(img, 0, 0, w, h); URL.revokeObjectURL(url);
      c.toBlob((b) => b ? res(b) : rej(new Error('blob')), 'image/jpeg', 0.84); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('decode')); };
    img.src = url;
  });
}
$('#photo-input').addEventListener('change', async (e) => {
  const f = e.target.files && e.target.files[0]; e.target.value = '';
  if (!f || !assets || !S.rec) return;
  const rid = S.rec; S.busy = true; render();
  try {
    const blob = await toJpeg(f);
    const up = await assets.upload(blob, {type: 'image/jpeg'});
    const old = S.photos[rid] && S.photos[rid].asset;
    S.photos[rid] = {asset: up.id, at: new Date().toISOString()};
    if (db) await db.doc('fotos/' + rid).set({asset: up.id, at: S.photos[rid].at});
    if (old && old !== up.id) assets.delete(old).catch(() => {});
    toast('Foto guardada');
  } catch (err) {
    const code = err && err.code;
    toast(code === 'too_large' ? 'La foto es demasiado grande.' : code === 'not_granted' ? 'Hace falta permiso de edición para subir fotos.' : code === 'quota_or_state' ? 'No queda espacio para más fotos.' : 'No se pudo subir la foto. Prueba otra vez.');
  }
  S.busy = false; render();
});
async function deletePhoto(){
  const rid = S.rec; const p = S.photos[rid]; S.confirm = null;
  if (!p) return render();
  delete S.photos[rid]; render();
  try { if (db) await db.doc('fotos/' + rid).delete(); if (assets && p.asset) await assets.delete(p.asset); toast('Foto quitada'); }
  catch (e) { toast('No se pudo quitar la foto.'); }
}

/* ---------- arranque ---------- */
async function boot(){
  DATA = APP_DATA;
  const w = weekInfo(); S.week = w.week; S.rw = w.week; S.day = w.todayIdx;
  const h = (location.hash || '').slice(1); if (['menu','recetas','lista','mas','alimentos','notas','batch','diario'].includes(h)) S.view = h;
  render();
  try { await LASSETS.init(); assets = LASSETS; } catch (e) { assets = null; }
  render();
  Promise.resolve(LDB).then((d) => {
    db = d; if (!db) return render();
    ['A','B'].forEach((wk) => db.doc('compra/semana-' + wk).onSnapshot((snap) => { S.checks[wk] = (snap.exists && snap.data()) || {}; render(); }, () => { S.live = false; render(); }));
    ['A','B'].forEach((wk) => { const k = mdKey(wk); db.doc('hecho/' + k).onSnapshot((snap) => { S.mdone[k] = (snap.exists && snap.data()) || {}; render(); }, () => {}); db.doc('batch/' + wk).onSnapshot((snap) => { S.bdone['batch-' + wk] = (snap.exists && snap.data()) || {}; render(); }, () => {}); });
    ['A','B'].forEach((wk) => db.doc('cambios/semana-' + wk).onSnapshot((snap) => { S.swaps[wk] = (snap.exists && snap.data()) || {}; render(); }, () => {}));
    db.collection('diario').onSnapshot((qs) => { S.diario = qs.docs.map((d) => Object.assign({id: d.id}, d.data())).sort((a, b) => (b.f || '').localeCompare(a.f || '')); render(); }, () => {});
    db.collection('fotos').onSnapshot((qs) => { const p = {}; qs.docs.forEach((doc) => { const v = doc.data(); if (v && v.asset) p[doc.id] = v; }); S.photos = p; render(); }, () => {});
  });
}
boot();
})();
