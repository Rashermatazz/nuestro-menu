<style>
/* Layout: una columna de app móvil (máx. 560px), barra de pestañas fija abajo, fichas blancas sobre fondo cálido; el amarillo marca lo activo. */
:root{
  --bg:#f7f6f2; --card:#ffffff; --line:#ebe8e0; --fg:#1d1c1a; --muted:#6c6a63; --soft:#f0eee7;
  --accent:#ffd23f; --accent-soft:#fff3c4; --on-accent:#1d1c1a; --accent-ink:#7a5c00;
  --des:#fff3c4; --com:#e2f2e6; --mer:#fde5da; --cen:#e5ebfa; --ink-des:#6b5200; --ink-com:#1c5a3a; --ink-mer:#8a3b1e; --ink-cen:#2a468c;
  --ok:#1f7a4d; --danger:#b3321f; --rec-soft:#fde0cc; --shop-soft:#f6dde3; --bad-soft:#fbe1dc; --bad-ink:#8a2b1c;
  --f-body:'Poppins', ui-sans-serif, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141412; --card:#1e1d1a; --line:#302e28; --fg:#f2f0ea; --muted:#a8a498; --soft:#26251f;
  --accent:#ffd23f; --accent-soft:#3a321a; --on-accent:#1d1c1a; --accent-ink:#ffd86b;
  --des:#3a3218; --com:#1c3325; --mer:#3b261d; --cen:#1f2740; --ink-des:#ffd86b; --ink-com:#8fd8ac; --ink-mer:#ffb293; --ink-cen:#a9bdf5;
  --ok:#6fd39c; --danger:#ff8a75; --rec-soft:#3d2a1c; --shop-soft:#3a2329; --bad-soft:#3d221d; --bad-ink:#ffb0a3; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#141412; --card:#1e1d1a; --line:#302e28; --fg:#f2f0ea; --muted:#a8a498; --soft:#26251f;
  --accent:#ffd23f; --accent-soft:#3a321a; --on-accent:#1d1c1a; --accent-ink:#ffd86b;
  --des:#3a3218; --com:#1c3325; --mer:#3b261d; --cen:#1f2740; --ink-des:#ffd86b; --ink-com:#8fd8ac; --ink-mer:#ffb293; --ink-cen:#a9bdf5;
  --ok:#6fd39c; --danger:#ff8a75; --rec-soft:#3d2a1c; --shop-soft:#3a2329; --bad-soft:#3d221d; --bad-ink:#ffb0a3; color-scheme:dark }
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font-family:inherit;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px calc(96px + env(safe-area-inset-bottom,0px))}
h1{font-size:24px;font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.3px}
h2{font-size:17px;font-weight:600;margin:0}
.muted{color:var(--muted)}
.top{display:flex;align-items:center;gap:10px;padding:10px 0 12px}
.top h1{flex:1}
.ib{width:44px;height:44px;border:none;border-radius:12px;background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;border:1px solid var(--line);flex:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px}
/* inicio */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:26px 0 18px}
.logo{width:60px;height:60px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.logo svg{stroke:var(--on-accent)}
.nav-card{display:flex;align-items:center;gap:14px;width:100%;padding:14px;margin-bottom:10px;text-align:left;cursor:pointer;min-height:72px}
.nav-card.hi{background:var(--accent-soft);border-color:transparent}
.nav-card.rec{background:var(--rec-soft);border-color:transparent}
.nav-card.shop{background:var(--shop-soft);border-color:transparent}
.nav-card .t{flex:1;display:flex;flex-direction:column}
.nav-card .t b{font-size:15px;font-weight:600}
.nav-card .t span{font-size:13px;color:var(--muted)}
.today{padding:14px;margin-bottom:14px;display:flex;flex-direction:column;gap:8px}
.today-row{display:flex;gap:10px;align-items:baseline;font-size:14px}
.today-row b{flex:none;width:104px;white-space:nowrap;font-weight:600;font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.today-row b .emo{margin-right:5px}
.tr-btn{width:100%;border:none;background:transparent;text-align:left;font:inherit;color:var(--fg);cursor:pointer;padding:6px 0;min-height:44px}
.tr-btn>span:nth-child(2){flex:1}
/* chips de días */
.weekbar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.wk{flex:none;min-height:40px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600;cursor:pointer}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;padding:4px;margin-bottom:12px}
.chip{min-height:56px;border:none;border-radius:11px;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11.5px;line-height:1.2}
.chip b{font-size:16px;font-weight:600}
.chip.on{background:var(--accent);color:var(--on-accent)}
.chip.is-today:not(.on) b{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.seg{display:flex;gap:4px;background:var(--soft);border-radius:12px;padding:4px;margin-bottom:12px}
.seg button{flex:1;min-height:40px;border:none;border-radius:9px;background:transparent;font-size:13px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--accent);color:var(--on-accent);font-weight:600}
/* comidas */
.meal{padding:12px;margin-bottom:12px}

const APP_DATA = {"version":"V15","ref":"2026-10-19","alts":[{"id":"alt-pollo-limon","t":"Pollo al limón con arroz integral y judías verdes","cat":"Comida","meta":"Comida · 35 min","cond":"zumo y ralladura de 1 limón, tomillo, pimienta, sal","ing":[["pechuga de pollo","200 g","140 g"],["arroz integral (seco)","60 g","65 g"],["judías verdes congeladas","150 g","150 g"],["zanahoria","60 g","60 g"]],"oil":"1 cucharada sopera (≈14 g)","s":["Arroz integral a cocer (lo que diga el paquete). JUDÍAS y ZANAHORIA en bastones: hervidas 10 min o al microondas tapadas 8 min.","PECHUGA en tiras con sal y pimienta. Sartén muy caliente con la mitad del aceite: 3 min por lado, hasta que no quede rosa. Resérvala.","Baja el fuego: zumo y ralladura del limón, tomillo y 3 cucharadas soperas de agua, 1 min raspando el fondo.","Vuelve el pollo y las verduras con el resto del aceite, 1-2 min para que se impregnen. Sirve con el arroz."],"tips":["La ralladura, solo la parte amarilla: la blanca amarga.","El jugo del fondo de la sartén es la salsa: no lo tires."],"use":[],"alt":true,"grupo":"Carne blanca","sustituye":["pollo-al-horno-con-arroz-integral-y-verduras","wok-de-cerdo-con-arroz-integral-brocoli-y-verduras","estofado-de-pollo-con-arroz","estofado-de-pollo-con-patata","pollo-a-la-sarten-con-verduras-salteadas"]},{"id":"alt-albondigas-pollo","t":"Albóndigas de pollo en salsa de tomate con arroz","cat":"Comida","meta":"Comida · 40 min · se puede hacer en batch","cond":"sal, pimienta, orégano, perejil; sin ajo ni cebolla en la masa","ing":[["carne picada de pollo","220 g","160 g"],["arroz integral (seco)","60 g","60 g"],["tomate triturado","150 g","150 g"],["zanahoria","60 g","60 g"],["calabacín","100 g","100 g"]],"oil":"1 cucharada sopera (≈14 g)","s":["Arroz integral a cocer según el paquete.","Mezcla la carne picada con sal, pimienta y perejil. Forma bolas del tamaño de una nuez (salen unas 10-12 por persona).","Cazuela con la mitad del aceite, fuego medio-fuerte: dora las albóndigas 4-5 min, girándolas. Resérvalas.","Resto del aceite: ZANAHORIA en dados pequeños 5 min, luego CALABACÍN 3 min.","Tomate triturado y orégano, y las albóndigas de vuelta: 15 min tapado a fuego suave, hasta que estén hechas por dentro."],"tips":["Manos mojadas para formar las bolas: no se pegan.","Aguantan 3 días en la nevera y se congelan bien."],"use":[],"alt":true,"grupo":"Carne blanca","sustituye":["wok-de-cerdo-con-arroz-integral-brocoli-y-verduras","estofado-de-pollo-con-arroz"]},{"id":"alt-brochetas-pollo","t":"Brochetas de pollo y verduras con patata","cat":"Cena","meta":"Cena · 30 min","cond":"sal, orégano, pimentón, limón","ing":[["pechuga de pollo","200 g","140 g"],["pimiento rojo","80 g","80 g"],["calabacín","100 g","100 g"],["patata","200 g","220 g"]],"oil":"1 cucharada sopera (≈14 g)","s":["PATATA en dados al microondas tapada con 2 cucharadas soperas de agua, 8-10 min.","Pincha en brochetas dados de PECHUGA, PIMIENTO y CALABACÍN alternados. Aliña con especias y la mitad del aceite.","Sartén o plancha muy caliente: 3-4 min por cada lado (4 lados), hasta que el pollo no tenga nada rosa.","Dora la patata 3 min en la misma sartén con el resto del aceite."],"tips":["Sin palillos, en dados igual de buenas: mismo tiempo.","Pollo y verdura del mismo tamaño para que se hagan a la vez."],"use":[],"alt":true,"grupo":"Carne blanca","sustituye":["pollo-al-horno-con-arroz-integral-y-verduras","wok-de-cerdo-con-arroz-integral-brocoli-y-verduras","estofado-de-pollo-con-arroz","estofado-de-pollo-con-patata","pollo-a-la-sarten-con-verduras-salteadas"]},{"id":"alt-lomo-patatas","t":"Lomo de cerdo con patatas y pimientos salteados","cat":"Comida","meta":"Comida o cena · 30 min","cond":"sal gorda, pimienta, romero, pimentón","ing":[["lomo de cerdo","180 g","130 g"],["patata","220 g","230 g"],["pimiento rojo","120 g","120 g"]],"oil":"1 cucharada sopera (≈14 g)","s":["PATATA en dados o gajos, tapada al microondas 6-8 min hasta que se pueda pinchar.","Sartén con parte del aceite: el PIMIENTO en tiras hasta que esté blando y la patata con romero hasta que se dore. Sal.","LOMO en filetes a la sartén muy caliente con un hilo de aceite, vuelta y vuelta. Sal gorda al final."],"tips":["Lomo fino y poco tiempo: si se pasa, se seca.","Reposa 1 min antes de servir."],"use":[],"alt":true,"grupo":"Carne blanca","sustituye":["pollo-al-horno-con-arroz-integral-y-verduras","wok-de-cerdo-con-arroz-integral-brocoli-y-verduras","estofado-de-pollo-con-arroz","estofado-de-pollo-con-patata"]},{"id":"alt-burger-ternera","t":"Hamburguesa casera de ternera magra con boniato y ensalada","cat":"Cena","meta":"Cena · 30 min","cond":"sal, pimienta, pimentón ahumado; sin pan","ing":[["carne picada magra de ternera","150 g","150 g"],["boniato","200 g","220 g"],["ensalada de bolsa","60 g","60 g"],["tomate","120 g","120 g"]],"oil":"1 cucharada sopera (≈11 g)","s":["BONIATO en dados, tapado al microondas hasta que se pueda pinchar; luego un momento a la sartén para dorarlo.","Hamburguesa a la sartén muy caliente casi sin aceite, bien hecha por dentro.","Ensalada con tomate y el aceite."],"tips":["Carne picada siempre bien hecha por dentro (sin rosa), y más desde noviembre.","Pide en la carnicería picada magra de ternera y haz 2 de 150 g."],"use":[],"alt":true,"grupo":"Carne roja","sustituye":["bistec-con-patatas-gajo-y-ensalada-de-col-rizada","bistec-con-patatas-y-pimiento-al-horno"]},{"id":"alt-macarrones-bocata","t":"Macarrones a la boloñesa estilo Bar Bocata","cat":"Comida","meta":"Comida · 45 min · la salsa se puede hacer en batch","cond":"para los dos: 1 cucharada sopera de carne de pimiento choricero, 1 cucharada sopera de vinagre balsámico, un rajolí de vino blanco (unas 2 cucharadas soperas, para probar), 2 ramitas de tomillo fresco (o 1 cucharilla pequeña seco), sal, pimienta; 1 diente de ajo solo para aromatizar el aceite (se retira)","ing":[["carne picada magra de ternera","150 g","120 g"],["pasta sin gluten (seca)","80 g","70 g"],["tomate triturado","130 g","130 g"],["tomate frito","20 g","20 g"],["cebolla","25 g","25 g"],["zanahoria","60 g","60 g"],["pimiento rojo","40 g","40 g"],["caldo de pollo (bajo en sal)","100 ml","100 ml"]],"oil":"½ cucharada sopera (≈8 g)","s":["Pon agua con sal a hervir para los macarrones (sin gluten: el tiempo del paquete, pruébalos 1-2 min antes).","Cazuela con la mitad del aceite y 1 diente de ajo laminado, fuego suave 1-2 min, hasta que esté dorado: sácalo y tíralo.","Para los dos: ½ CEBOLLA pequeña (unos 50 g), 1 ZANAHORIA grande (unos 120 g) muy picadas y ½ PIMIENTO rojo (unos 80 g) en dados pequeños, fuego medio, 10 min, hasta que estén tostados. Añade la carne de pimiento choricero, 1 min.","Sube el fuego: la CARNE PICADA de los dos (unos 270 g, la bandeja pequeña), 6-8 min, sin removerla demasiado para que se dore y se pegue un poco al fondo.","Desglasa: 1 cucharada sopera de vinagre balsámico y luego un rajolí de vino blanco, rascando el fondo con la cuchara, 2 min.","TOMATE TRITURADO (unos 260 g, media lata grande), 3 cucharadas soperas de TOMATE FRITO (unos 40 g) y el tomillo, 15 min a fuego suave.","1 vaso de CALDO de pollo (200 ml) y 15 min más, hasta que espese. Mezcla con los macarrones escurridos y reparte según los gramos de cada uno."],"tips":["Lo que se pega al fondo y se rasca con el vinagre es lo que da el sabor de bar: no lo saltes.","La original lleva también manteca, butifarra, parmesano y brandy: aquí no van.","Cebolla: la misma cantidad que en el guiso de sepia, que a Natalia le va bien; si un día le sienta mal, haced su ración sin ella.","Ajo: el aroma pasa al aceite; lo que le sienta mal a Natalia se queda en el diente, por eso se retira antes de añadir nada más. El ajo en polvo, mejor no.","Vino blanco: un chorrito para probar si es el toque del bar; con la cocción se evapora casi todo. Si no os convence, fuera.","La salsa se congela muy bien: haced el doble y guardad la mitad."],"use":[],"alt":true,"grupo":"Carne roja","sustituye":["bistec-con-patatas-gajo-y-ensalada-de-col-rizada"]},{"id":"alt-salmon-boniato-brocoli","t":"Salmón a la plancha con boniato y brócoli","cat":"Cena","meta":"Cena · 30 min","cond":"sal, eneldo, limón, pimienta","ing":[["salmón (1 lomo)","125 g","125 g"],["boniato","200 g","200 g"],["brócoli (solo ramilletes)","80 g","60 g"]],"oil":"1 cucharada sopera (≈10 g)","s":["BONIATO en dados y BRÓCOLI (solo ramilletes), tapados al microondas hasta que estén tiernos.","Sartén con la mitad del aceite: dora el boniato y el brócoli, sal. Aparta.","SALMÓN con la piel hacia abajo y el resto del aceite, fuego medio, hasta que esté hecho casi del todo; vuelta un momento. Limón y eneldo."],"tips":["Salmón descongelado la noche antes en la nevera.","Brócoli congelado: sin descongelar, va directo a la bandeja."],"use":[],"alt":true,"grupo":"Pescado azul","sustituye":["salmon-con-patata-y-judias-verdes","salmon-con-boniato-y-judias-verdes","pasta-con-salmon-calabacin-y-tomate"]},{"id":"alt-merluza-horno-pimientos","t":"Merluza a la plancha con patata, tomate y pimiento","cat":"Cena","meta":"Cena · 35 min","cond":"sal, pimentón dulce, perejil, limón","ing":[["merluza congelada","230 g","170 g"],["patata","200 g","240 g"],["tomate","150 g","150 g"],["pimiento rojo","100 g","100 g"]],"oil":"1 cucharada sopera (≈14 g)","s":["PATATA en dados o gajos, tapada al microondas 6-8 min hasta que se pueda pinchar.","Sartén con la mitad del aceite: el PIMIENTO en tiras, la patata y al final el TOMATE en trozos, sal y pimentón, hasta que el tomate se ablande.","MERLUZA (mejor descongelada y bien seca) con el resto del aceite, vuelta y vuelta hasta que se separe en láminas. Perejil y limón."],"tips":["El tomate asado hace de salsa: no hace falta nada más.","Pimiento en tiras finas para que se haga a la vez que la patata."],"use":[],"alt":true,"grupo":"Pescado blanco o marisco","sustituye":["merluza-con-patata-y-calabacin","dorada-con-patata-y-calabacin","guiso-de-sepia-con-patatas","calamares-a-la-sarten-con-patata-y-ensalada","sepia-a-la-sarten-con-patatas-y-ensalada","arroz-salteado-con-gambas-y-verduras"]},{"id":"alt-gambas-arroz","t":"Gambas al ajillo suave con arroz y calabacín","cat":"Comida","meta":"Comida o cena · 25 min","cond":"ajo solo para el aceite, guindilla opcional, perejil, sal","ing":[["gamba pelada congelada","200 g","140 g"],["arroz blanco (seco)","70 g","70 g"],["calabacín","150 g","150 g"],["judías verdes congeladas","120 g","120 g"]],"oil":"1 cucharada sopera (≈16 g)","s":["ARROZ blanco a cocer según el paquete.","Sartén con el aceite y 2 dientes de ajo laminados, fuego suave 2 min; sácalos.","Sube el fuego: CALABACÍN en dados y JUDÍAS verdes (ya hervidas 8 min o del microondas) 4 min.","GAMBAS secas, 2 min. Perejil y sal. Sirve con el arroz."],"tips":["Gambas descongeladas y muy secas con papel: así se doran.","Más de 2-3 min y quedan gomosas."],"use":[],"alt":true,"grupo":"Pescado blanco o marisco","sustituye":["merluza-con-patata-y-calabacin","dorada-con-patata-y-calabacin","guiso-de-sepia-con-patatas","calamares-a-la-sarten-con-patata-y-ensalada","sepia-a-la-sarten-con-patatas-y-ensalada","arroz-salteado-con-gambas-y-verduras"]},{"id":"alt-garbanzos-calamar","t":"Garbanzos salteados con calamar y verduras","cat":"Comida","meta":"Comida · 25 min","cond":"pimentón de la Vera, comino, perejil, sal","ing":[["calamar limpio","150 g","150 g"],["garbanzos de bote (escurridos)","150 g","40 g"],["pimiento rojo","60 g","60 g"],["calabacín","100 g","100 g"],["tomate","80 g","80 g"],["patata","—","150 g"]],"oil":"1 cucharada sopera (≈16 g)","s":["Enjuaga muy bien los garbanzos. PATATA de Natalia en dados al microondas tapada, 8 min.","Sartén grande con la mitad del aceite: PIMIENTO 5 min, CALABACÍN 3 min.","Garbanzos, tomate en dados y especias, 3 min. Resérvalo.","Resto del aceite, fuego muy fuerte: CALAMAR en anillas 2-3 min. Junta todo y perejil."],"tips":["El calamar al final y a fuego fuerte, o se vuelve chicle.","Natalia toma pocos garbanzos (40 g) y patata: le sientan mejor."],"use":[],"alt":true,"grupo":"Legumbre","sustituye":["lentejas-con-contramuslo-y-verduras","garbanzos-con-pollo-y-verduras"]},{"id":"alt-huevos-pisto","t":"Huevos al plato con pisto y pan","cat":"Cena","meta":"Cena · 35 min","cond":"sal, orégano, pimentón","ing":[["huevos","2 u","2 u"],["calabacín","120 g","120 g"],["pimiento rojo","60 g","60 g"],["berenjena","60 g","60 g"],["tomate triturado","100 g","100 g"],["pan 100 % integral","60 g","—"],["pan de arroz","—","60 g"]],"oil":"1 cucharada sopera (≈16 g)","s":["Sartén con el aceite, fuego medio: PIMIENTO 8 min, BERENJENA 8 min, CALABACÍN 5 min.","Tomate triturado, 10 min a fuego suave.","Haz 4 huecos en el pisto y casca los HUEVOS. Tapa y 4-5 min, hasta que la clara cuaje y la yema quede a tu gusto.","Con pan: integral Mario, de arroz Natalia."],"tips":["Desde noviembre, la yema bien cuajada para Natalia.","El pisto puede ser del batch: así son 10 minutos."],"use":[],"alt":true,"grupo":"Huevo","sustituye":["tortilla-de-calabacin-con-ensalada-de-col-rizada","tortilla-de-patata-con-ensalada-de-col-rizada","m-revuelto-con-calabacin-y-ensalada-n-crema-de-calabaza-con-","m-tortilla-francesa-con-ensalada-n-crema-de-calabacin-con-to"]}],"subs":{"pollo-al-horno-con-arroz-integral-y-verduras":[{"id":"alt-pollo-limon","t":"Pollo al limón con arroz integral y judías verdes","M":"pechuga 250 g · arroz integral (seco) 60 g · judías verdes 150 g · verduras 60 g","N":"pechuga 140 g · arroz integral (seco) 70 g · judías verdes 150 g · verduras 60 g","ing":[["pechuga de pollo","250 g","140 g"],["arroz integral (seco)","60 g","70 g"],["judías verdes congeladas","150 g","150 g"],["zanahoria","60 g","60 g"]],"oil":"1 cucharada sopera (≈14 g)","kM":623,"kN":555,"oM":612,"oN":563,"pM":63,"pN":39,"opM":62,"opN":38},{"id":"alt-brochetas-pollo","t":"Brochetas de pollo y verduras con patata","M":"pechuga 250 g · patata 310 g · verduras 180 g","N":"pechuga 150 g · patata 370 g · verduras 180 g","ing":[["pechuga de pollo","250 g","150 g"], lada · N: crema de calabaza con revuelto","M":"2 huevos · calabacín 150 g · pan integral 50 g · ensalada 200 g","N":"2 huevos · pan de arroz 50 g · crema de calabaza 485 g","ps":{"M":"sin postre","N":"½ fila de chocolate"},"r":"m-revuelto-con-calabacin-y-ensalada-n-crema-de-calabaza-con-"}],"kM":"1.770","kN":"1.910","free":false}]},"recipes":[{"id":"pancakes-de-avena-y-platano","t":"Pancakes de avena y plátano","cat":"Desayuno","meta":"Mario · 15 min","cond":"canela (opcional)","ing":[["copos de avena","100 g","—"],["plátano","120 g","—"],["huevos","2 u","—"],["frutos rojos congelados","50 g","—"],["chocolate 85 %","15 g","—"],["bebida de avena","90 g","—"]],"oil":"3-4 golpes de spray","s":["Tritura la avena, el plátano, los 2 huevos y la bebida de avena (90 g) hasta tener una masa espesa. Deja reposar 5 min.","Sartén antiadherente a fuego medio (5 en la vitro), 3-4 golpes de spray de AOVE. Un cucharón por pancake.","Cuando salgan burbujas y los bordes se vean secos (2-3 min), vuelta y 1-2 min más.","Frutos rojos al microondas 1 min y la fila de chocolate en trocitos por encima."],"tips":["Si la masa sale muy espesa, un chorrito más de bebida de avena.","Fuego medio, no fuerte: si no, se queman por fuera y quedan crudos por dentro.","La primera tanda suele salir peor: la sartén aún no está a temperatura."],"use":["A lun","B dom","B lun","A dom"]},{"id":"bol-de-avena-con-yogur","t":"Bol de avena con yogur","cat":"Desayuno","meta":"Mario · 5 min","cond":"canela (opcional)","ing":[["copos de avena","50 g","—"],["Activia","1 u","—"],["plátano","100 g","—"],["frutos rojos congelados","50 g","—"],["nueces","15 g","—"]],"oil":"","s":["Mezcla la avena con el Activia en un bol o táper.","Añade el plátano en rodajas y los frutos rojos congelados encima.","Si lo preparas la noche antes, a la nevera tapado: por la mañana la avena está blanda y la fruta descongelada."],"tips":["Martes: preparado la noche del lunes, listo para llevar."],"use":["A mar","B mar"]},{"id":"bocadillo-de-tortilla-francesa","t":"Bocadillo de tortilla francesa","cat":"Desayuno","meta":"Mario · trabajo · 5 min","cond":"sal","ing":[["pan de barra","80 g","—"],["huevos","2 u","—"]],"oil":"1 cucharilla pequeña (de café)","s":["Bate los 2 huevos con una pizca de sal.","Sartén a fuego medio con 2-3 golpes de spray o unas gotas de aceite. Cuaja 1-2 min, dobla y 30 s más.","Abre el pan, frota medio tomate y mete la tortilla. Envuelve en papel de aluminio."],"tips":["Hecho la noche antes aguanta bien en la nevera hasta mediodía.","Si dejas la tortilla templar 1 min antes de meterla, el pan no se reblandece."],"use":["A mié","A jue","A vie","B mié","B jue","B vie"]},{"id":"tostadas-de-jamon-y-de-atun","t":"Tostadas de jamón y de atún","cat":"Desayuno","meta":"Mario · sábado · 5 min","cond":"sal","ing":[["pan 100 % integral","70 g","—"],["tomate","80 g","—"],["jamón Duroc","30 g","—"],["atún al natural","1 lata","—"],["mandarinas","1 u","—"]],"oil":"1 cucharilla pequeña (de café)","s":["Tuesta el pan integral.","Ralla el tomate, repártelo y un hilo de aceite: 1 cucharilla pequeña, de café, para todas.","En una, el jamón; en las otras, el atún escurrido. Mandarina de postre."],"tips":["Rallar el tomate con un rallador grueso: la piel se queda en la mano."],"use":["A sáb","B sáb"]},{"id":"tostadas-de-natalia","t":"Tostadas de Natalia","cat":"Desayuno","meta":"Natalia · 5-10 min","cond":"sal, pimienta","ing":[["pan de arroz","—","70 g"],["huevos","—","1 u"],["aguacate","—","40 g"],["kiwi","—","1 u"],["mandarinas","—","1 u"],["jamón Cerezo (mar, jue, sáb, dom) o queso de cabra curado (lun, mié, vie)","—","20 g"]],"oil":"","s":["Tuesta el pan de arroz.","Huevo a la sartén con unas gotas de aceite, o cocido (10 min en agua hirviendo; se pueden dejar 3-4 hechos para la semana).","Encima, el aguacate en láminas y el jamón (o el queso de cabra los lunes, miércoles y viernes).","Acompaña con el kiwi y la mandarina."],"tips":["Desde noviembre, sin jamón curado: pollo asado en lonchas, queso de cabra curado o más aguacate."],"use":["todos los días"]},{"id":"ensalada-de-col-rizada","t":"Ensalada de col rizada","cat":"Base","meta":"Base de las ensaladas · 5 min","cond":"sal, limón o vinagre","ing":[["col rizada (kale)","80 g","60 g"],["tomate","120 g","120 g"],["olivas verdes","15 g","10 g"]],"oil":"1 cucharada sopera (≈16 g)","s":["Quita el tallo duro de las hojas y córtalas en tiras finas.","Masajea 1-2 min con el aceite, una pizca de sal y unas gotas de limón.","Añade el tomate y las olivas."],"tips":["El masaje la ablanda y le quita amargor.","Si a Natalia le sienta mal cruda, 1 min en la sartén.","Aliño alternativo: aceite + limón + unas gotas de soja tamari, sin sal."],"use":[]},{"id":"pollo-al-horno-con-arroz-integral-y-verduras","t":"Pollo a la plancha con arroz integral y verduras","cat":"Comida","meta":"Batch domingo · 35 min","cond":"salsa de soja tamari (1 cucharada sopera; sin más sal en el pollo), pimienta, pimentón dulce, orégano, romero; un poco de sal solo en la verdura","ing":[["pechuga de pollo","250 g","140 g"],["arroz integral (seco)","60 g","70 g"],["calabacín","70 g","70 g"],["pimiento rojo","50 g","50 g"],["berenjena","50 g","50 g"],["zanahoria","50 g","50 g"],["mandarinas","1 u","2 u"]],"oil":"1 cucharada sopera (≈16 g)","s":["Pon a cocer el ARROZ integral en agua con sal (lo que diga el paquete).","Corta la verdura: zanahoria en rodajas finas, pimiento y berenjena en trozos, calabacín en medias lunas.","Sartén grande con la mitad del aceite, fuego medio-fuerte: primero la ZANAHORIA, luego PIMIENTO y BERENJENA, y al final el CALABACÍN. Sal y fuera.","Mezcla la pechuga en filetes con 1 cucharada sopera de soja tamari y el pimentón (sin sal).","En la misma sartén, el resto del aceite y la PECHUGA a fuego fuerte, vuelta y vuelta hasta que no quede nada rosa por dentro.","Un chorrito de limón y reparte en tápers: pollo, arroz escurrido, verduras y la mandarina aparte."],"tips":["No amontones la verdura: en una capa se asa; amontonada, se cuece y suelta agua.","La berenjena chupa mucho aceite: dale la vuelta con las otras verduras en vez de añadirle más.","Si los filetes son gruesos, ábrelos en dos: se hacen igual que la verdura y no se secan.","El arroz integral escurrido y extendido en un plato no se apelmaza en el táper.","Salsa de soja tamari Kikkoman sin gluten: de 1 cucharilla pequeña (de café) a 1 cucharada sopera para el plato de los dos. 1 cucharada sopera ≈ 2,5 g de sal: ese día, no añadas sal."],"use":["A lun"]},{"id":"guiso-de-sepia-con-patatas","t":"Guiso de sepia con patatas","cat":"Comida","meta":"Martes A · 50 min","cond":"sal, pimentón dulce, 1 hoja de laurel, perejil","ing":[["sepia limpia","150 g","120 g"],["patata","170 g","220 g"],["tomate triturado","80 g","80 g"],["pimiento rojo","60 g","60 g"],["zanahoria","50 g","50 g"],["cebolla","40 g","30 g"],["caldo de pescado","250 ml","200 ml"],["huevos","2 u","1 u"]],"oil":"1 cucharada sopera (≈14 g)","s":["Mientras, cuece los HUEVOS 10 min, enfríalos en agua fría y pélalos: van partidos por la mitad encima al servir.","Corta la sepia en dados de 2-3 cm. Cazuela con la mitad del aceite a fuego fuerte: marca la sepia 3-4 min y resérvala.","Baja a fuego suave, el resto del aceite: la CEBOLLA muy picada con una pizca de sal, 8-10 min, hasta que esté transparente (sin dorarse).","Añade la ZANAHORIA en dados pequeños, 5 min. Luego el PIMIENTO en dados, 4 min.","Tomate triturado, 5 min. Fuera del fuego, 1 cucharilla pequeña (de café) de pimentón y remueve (así no se quema).","Vuelve la sepia, laurel y el caldo de pescado. Tapa y 20 min a fuego suave.","Añade la patata \"chascada\" y 15-20 min más, hasta que esté tierna. Reposa 5 min y perejil."],"tips":["Chascar la patata (cortar un poco y romper) suelta almidón y espesa la salsa sin harina.","Si la sepia sigue dura, 10 min más tapado: se ablanda con la cocción larga.","La cebolla congelada vale: va directa a la cazuela, 2 min más para que se evapore el agua.","Mejor hecho la víspera: los guisos ganan de un día para otro."],"use":["A mar"]},{"id":"lentejas-con-contramuslo-y-verduras","t":"Lentejas con contramuslo y verduras","cat":"Comida","meta":"Batch · 1 olla para miércoles y jueves · 40 min","cond":"sal, pimentón dulce, comino, 1 hoja de laurel","ing":[["lentejas de bote (escurridas)","200 g","50 g"],["contramuslo de pollo","95 g","70 g"],["zanahoria","60 g","60 g"],["pimiento rojo","40 g","40 g"],["tomate triturado","70 g","70 g"],["mandarinas","1 u","2 u"],["patata","—","150 g"]],"oil":"1 cucharada sopera (≈13 g)","s":["Enjuaga muy bien las lentejas de los 2 botes en un colador.","Cazuela con la mitad del aceite, fuego medio-fuerte: dora el CONTRAMUSLO en dados, 5 min. Resérvalo.","Resto del aceite, fuego medio: ZANAHORIA en dados pequeños, 5 min. Luego PIMIENTO, 4 min.","Tomate triturado, 3 min. Pimentón y comino fuera del fuego, remover.","Vuelve el pollo, unos 600 ml de agua, laurel y la PATATA de Natalia en dados. Tapa, 15-20 min a fuego suave.","Añade las LENTEJAS y 10 min más sin tapa. Ajusta sal.","Reparte: cada día Mario 200 g de lentejas y Natalia 50 g con su patata (gramos en la tabla)."],"tips":["Las lentejas de bote ya están cocidas: si hierven mucho rato se deshacen. Siempre al final.","Enjuagarlas quita parte de los FODMAP (pasan al líquido del bote): le sientan mejor a Natalia.","El comino ayuda a la digestión de la legumbre y le da sabor sin cebolla.","Aguantan 3-4 días en la nevera; al calentar, un chorrito de agua."],"use":["A mié","A jue"]},{"id":"wok-de-cerdo-con-arroz-integral-brocoli-y-verduras","t":"Wok de cerdo con arroz integral, brócoli y verduras","cat":"Comida","meta":"Viernes A · 25 min","cond":"pimienta, jengibre, salsa de soja tamari (sin sal añadida)","ing":[["cerdo magro","240 g","160 g"],["arroz integral (seco)","60 g","70 g"],["pimiento congelado","80 g","80 g"],["calabacín","80 g","80 g"],["zanahoria","60 g","60 g"],["brócoli (solo ramilletes)","80 g","60 g"]],"oil":"1 cucharada sopera (≈16 g)","s":["Arroz integral cocido (del batch o según paquete).","Cerdo en tiras finas. Sartén o wok MUY caliente con un tercio del aceite: 3-4 min y resérvalo.","Resto del aceite: ZANAHORIA en bastones finos, 3 min.","BRÓCOLI (ramilletes, congelado sin descongelar) con un chorrito de agua y tapa, 4 min.","PIMIENTO congelado y CALABACÍN en medias lunas, sin tapa, 3 min.","Vuelve el cerdo y el arroz, la soja y el jengibre: 2 min removiendo."],"tips":["Fuego fuerte y en tandas: si se amontona, cuece en vez de saltear.","El chorrito de agua con tapa hace el brócoli al vapor en 4 min y queda crujiente.","Corta el cerdo a contraveta (perpendicular a las fibras): queda más tierno.","Salsa de soja tamari Kikkoman sin gluten: de 1 cucharilla pequeña (de café) a 1 cucharada sopera para el plato de los dos. 1 cucharada sopera ≈ 2,5 g de sal: ese día, no añadas sal."],"use":["A vie"]},{"id":"calamares-a-la-sarten-con-patata-y-ensalada","t":"Calamares a la sartén con patata y ensalada","cat":"Comida","meta":"Domingo B · 25 min","cond":"sal, ajo, perejil, limón","ing":[["calamar limpio","220 g","180 g"],["patata","180 g","250 g"],["ensalada de bolsa","60 g","60 g"],["tomate","150 g","150 g"]],"oil":"1 cucharada sopera y media (≈21 g)","s":["PATATA en dados al microondas en un recipiente tapado con 2 cucharadas soperas de agua, 8-10 min, removiendo a mitad.","Seca muy bien el calamar en anillas con papel de cocina.","Sartén muy caliente con parte del aceite. Para Natalia, dora antes un diente de ajo laminado 1 min y sácalo.","Calamar 2-3 min, removiendo. Sal, perejil y limón al final.","Ensalada y tomate con el resto del aceite."],"tips":["Más de 3 min y el calamar se vuelve chicle: o muy poco o muy largo (guiso).","Si suelta agua, sácalo, deja que la sartén vuelva a calentar y termina en dos tandas."],"use":["B dom"]},{"id":"estofado-de-pollo-con-arroz","t":"Estofado de pollo con arroz","cat":"Comida","meta":"Lunes B · batch · 1 olla para 2 días · 45 min","cond":"sal, pimienta, pimentón, tomillo, 1 hoja de laurel","ing":[["patata","60 g","100 g"],["arroz integral (seco)","45 g","55 g"],["zanahoria","80 g","80 g"],["pimiento rojo","50 g","50 g"],["tomate triturado","60 g","60 g"],["mandarinas","1 u","2 u"],["contramuslo de pollo","200 g","130 g"]],"oil":"1 cucharada sopera (≈13 g)","s":["Una sola olla para el lunes (con arroz) y el miércoles (con patata).","Cazuela con la mitad del aceite, fuego medio-fuerte: dora el CONTRAMUSLO en dados, 5-6 min. Resérvalo.","Resto del aceite: ZANAHORIA en dados, 5 min. Luego PIMIENTO, 4 min.","Tomate triturado y especias, 3 min.","Vuelve el pollo, toda la PATATA en trozos y agua hasta cubrir. Tapa, 25-30 min a fuego suave.","Aparte, el arroz integral para el lunes.","Lunes: estofado con arroz y un poco de patata; miércoles: el resto de la patata (gramos en la tabla)."],"tips":["Dorar bien el pollo al principio es lo que da el sabor al caldo.","Si queda caldoso, destapa los últimos 10 min.","Mandarina de postre los dos días."],"use":["B lun"]},{"id":"estofado-de-pollo-con-patata","t":"Estofado de pollo con patata","cat":"Comida","meta":"Miércoles B · de la olla del lunes","cond":"sal, pimienta, pimentón, tomillo, 1 hoja de laurel","ing":[["patata","150 g","220 g"],["zanahoria","80 g","80 g"],["pimiento rojo","50 g","50 g"],["tomate triturado","60 g","60 g"],["mandarinas","1 u","2 u"],["contramuslo de pollo","200 g","130 g"]],"oil":"1 cucharada sopera (≈13 g)","s":["Una sola olla para el lunes (con arroz) y el miércoles (con patata).","Cazuela con la mitad del aceite, fuego medio-fuerte: dora el CONTRAMUSLO en dados, 5-6 min. Resérvalo.","Resto del aceite: ZANAHORIA en dados, 5 min. Luego PIMIENTO, 4 min.","Tomate triturado y especias, 3 min.","Vuelve el pollo, toda la PATATA en trozos y agua hasta cubrir. Tapa, 25-30 min a fuego suave.","Aparte, el arroz integral para el lunes.","Lunes: estofado con arroz y un poco de patata; miércoles: el resto de la patata (gramos en la tabla)."],"tips":["Dorar bien el pollo al principio es lo que da el sabor al caldo.","Si queda caldoso, destapa los últimos 10 min.","Mandarina de postre los dos días."],"use":["B mié"]},{"id":"pisto-con-atun-huevo-y-arroz-integral","t":"Pisto con atún, huevo y arroz integral","cat":"Comida","meta":"Martes B · 45 min","cond":"sal, orégano, una pizca de azúcar si el tomate está ácido","ing":[["arroz integral (seco)","55 g","60 g"],["calabacín","150 g","150 g"],["pimiento rojo","80 g","80 g"],["berenjena","80 g","80 g"],["tomate triturado","100 g","100 g"],["atún al natural","1 lata","1 lata"],["huevos","1 u","1 u"]],"oil":"1 cucharada sopera (≈14 g)","s":["Arroz integral según el paquete. 2 huevos en agua hirviendo 10 min, a agua fría y pelar.","Sartén grande con el aceite, fuego medio: PIMIENTO en dados, 8 min.","Añade la BERENJENA en dados, 8 min.","Añade el CALABACÍN en dados, 5 min.","Tomate triturado, 10-15 min a fuego suave, hasta que espese.","Sirve: arroz, pisto, 1 lata de atún escurrida y 1 huevo en cuartos para cada uno."],"tips":["Cada verdura entra cuando la anterior ya está blanda: así no queda nada crudo ni nada deshecho.","La berenjena con sal 10 min antes y secada absorbe menos aceite.","Mejor de un día para otro."],"use":["B mar"]},{"id":"garbanzos-con-pollo-y-verduras","t":"Garbanzos con pollo y verduras","cat":"Comida","meta":"Jueves B · batch · 35 min","cond":"sal, pimentón, comino, 1 hoja de laurel","ing":[["garbanzos de bote (escurridos)","150 g","40 g"],["pechuga de pollo","170 g","130 g"],["zanahoria","100 g","100 g"],["patata","90 g","180 g"],["tomate triturado","60 g","60 g"],["mandarinas","1 u","2 u"]],"oil":"1 cucharada sopera (≈13 g)","s":["Enjuaga bien los garbanzos de bote.","Cazuela con la mitad del aceite: PECHUGA en dados, 4-5 min. Resérvala.","Resto del aceite: ZANAHORIA en rodajas, 5 min.","PATATA en dados y tomate, 2 min. Especias fuera del fuego.","Agua hasta cubrir y laurel: 15-20 min tapado.","Garbanzos y el pollo de vuelta, 5-8 min más."],"tips":["La pechuga vuelve al final para que no se seque en el guiso.","Enjuagar los garbanzos ayuda a Natalia, igual que con las lentejas."],"use":["B jue"]},{"id":"arroz-salteado-con-gambas-y-verduras","t":"Arroz salteado con gambas y verduras","cat":"Comida","meta":"Viernes B · 25 min","cond":"ajo solo para el aceite, jengibre, salsa de soja tamari (sin sal añadida), cebollino","ing":[["arroz blanco (seco)","65 g","75 g"],["gamba pelada congelada","200 g","140 g"],["pimiento congelado","60 g","60 g"],["calabacín","80 g","80 g"],["zanahoria","50 g","50 g"]],"oil":"1 cucharada sopera (≈16 g)","s":["Arroz blanco cocido y frío (mejor del día anterior).","Gambas descongeladas y secas. Sartén muy caliente con un tercio del aceite, 2 min. Resérvalas.","Resto del aceite: ZANAHORIA en dados pequeños, 3-4 min.","CALABACÍN en dados y PIMIENTO congelado, 3 min.","Arroz frío, 3-4 min a fuego fuerte sin parar de remover. Vuelven las gambas y la soja, 1 min."],"tips":["Con arroz recién hecho sale pastoso: frío de nevera se separa grano a grano.","Gambas más de 2-3 min = gomosas.","Salsa de soja tamari Kikkoman sin gluten: de 1 cucharilla pequeña (de café) a 1 cucharada sopera para el plato de los dos. 1 cucharada sopera ≈ 2,5 g de sal: ese día, no añadas sal."],"use":["B vie"]},{"id":"pollo-a-la-sarten-con-verduras-salteadas","t":"Pollo a la sartén con verduras salteadas","cat":"Comida","meta":"Domingo A · 20 min","cond":"sal (poca), pimienta, orégano, salsa de soja tamari, limón","ing":[["pechuga de pollo","200 g","180 g"],["calabacín","150 g","150 g"],["pimiento rojo","100 g","100 g"],["zanahoria","80 g","80 g"],["pan 100 % integral","50 g","—"],["pan de arroz","—","60 g"]],"oil":"1 cucharada sopera y media (≈17 g)","s":["Verduras en tiras: ZANAHORIA en bastones finos, PIMIENTO y CALABACÍN.","Sartén grande con parte del aceite, fuego medio-fuerte: ZANAHORIA tapada, 5 min.","PIMIENTO, 4 min. CALABACÍN, 3-4 min. Sal al final.","En otra sartén muy caliente, la PECHUGA en filetes: 3-4 min por lado.","Al final, 1 cucharilla pequeña (de café) de soja en las verduras, 30 s removiendo; unas gotas de limón al pollo.","Mario con pan integral; Natalia con pan de arroz."],"tips":["No muevas el pollo el primer minuto: se dora y se despega solo.","La sal en la verdura al final: si la pones al principio, suelta agua y no se dora.","Salsa de soja tamari Kikkoman sin gluten: de 1 cucharilla pequeña (de café) a 1 cucharada sopera para el plato de los dos. 1 cucharada sopera ≈ 2,5 g de sal: ese día, no añadas sal."],"use":["A dom"]},{"id":"salmon-con-patata-y-judias-verdes","t":"Salmón con patata y judías verdes","cat":"Cena","meta":"Cena · 20 min","cond":"pimienta, eneldo, limón, unas gotas de soja tamari (opcional)","ing":[["salmón (1 lomo)","125 g","125 g"],["patata","180 g","220 g"],["judías verdes congeladas","150 g","150 g"]],"oil":"½ cucharada sopera (≈9 g)","s":["PATATA en dados y JUDÍAS verdes congeladas, juntas: hervidas 12-15 min, o al microondas tapadas con un poco de agua 10-12 min.","Sartén antiadherente con el aceite, fuego medio: SALMÓN por el lado de la piel (o el más plano) 4 min, vuelta y 2-3 min.","Sal y limón al final. Un hilo de aceite por encima de la verdura."],"tips":["Saca el salmón del congelador a la nevera la noche antes.","Si lo tocas antes de 3-4 min, se rompe: espera a que se despegue solo.","Salsa de soja tamari Kikkoman sin gluten: de 1 cucharilla pequeña (de café) a 1 cucharada sopera para el plato de los dos. 1 cucharada sopera ≈ 2,5 g de sal: ese día, no añadas sal."],"use":["A lun"]},{"id":"salmon-con-boniato-y-judias-verdes","t":"Salmón con boniato y judías verdes","cat":"Cena","meta":"Cena · 20 min","cond":"sal, pimienta, eneldo o limón","ing":[["salmón (1 lomo)","125 g","125 g"],["boniato","180 g","220 g"],["judías verdes congeladas","150 g","150 g"]],"oil":"½ cucharada sopera (≈9 g)","s":["BONIATO en su bolsa al microondas (lo que indique la bolsa). JUDÍAS hervidas 8-10 min.","Salmón: 4 min por un lado y 2-3 por el otro, a fuego medio.","Sal y limón al final."],"tips":["Saca el salmón del congelador a la nevera la noche antes.","Si lo tocas antes de 3-4 min, se rompe: espera a que se despegue solo."],"use":["B lun"]},{"id":"salmon-con-patata-y-ensalada-de-col-rizada","t":"Salmón con patata y ensalada de col rizada","cat":"Cena","meta":"Cena · 20 min","cond":"sal, pimienta, eneldo o limón","ing":[["salmón (1 lomo)","125 g","125 g"],["patata","180 g","220 g"],["tomate","150 g","150 g"],["col rizada (kale)","80 g","60 g"],["olivas verdes","15 g","10 g"],["garbanzos de bote (escurridos)","60 g","—"]],"oil":"½ cucharada sopera (≈9 g)","s":["PATATA en dados al microondas tapada, 8-10 min.","Ensalada de col rizada (ver su ficha). Mario: + 60 g de garbanzos enjuagados.","Salmón: 4 min por un lado y 2-3 por el otro, a fuego medio."],"tips":["Saca el salmón del congelador a la nevera la noche antes.","Si lo tocas antes de 3-4 min, se rompe: espera a que se despegue solo."],"use":["B vie"]},{"id":"pasta-con-salmon-calabacin-y-tomate","t":"Pasta con salmón, calabacín y tomate","cat":"Cena","meta":"Viernes A · 25 min","cond":"sal, pimienta, albahaca u orégano","ing":[["pasta sin gluten (seca)","65 g","65 g"],["salmón (1 lomo)","125 g","125 g"],["calabacín","250 g","250 g"],["tomate triturado","80 g","80 g"]],"oil":"1 cucharada sopera (≈13 g)","s":["Agua con sal a hervir; PASTA sin gluten el tiempo del paquete (prueba 1-2 min antes).","Sartén con el aceite: CALABACÍN en dados, 5 min.","SALMÓN sin piel en dados, 2-3 min.","Tomate triturado, 5 min. Mezcla con la pasta escurrida."],"tips":["Guarda medio vaso del agua de la pasta: un chorrito liga la salsa.","La pasta sin gluten se pasa rápido: mejor al dente."],"use":["A vie"]},{"id":"merluza-con-patata-y-calabacin","t":"Merluza con patata y calabacín","cat":"Cena","meta":"Miércoles A · cena · 30 min","cond":"sal, perejil, limón, ajo solo para el aceite","ing":[["merluza congelada","230 g","170 g"],["patata","180 g","250 g"],["calabacín","200 g","200 g"]],"oil":"1 cucharada sopera (≈13 g)","s":["PATATA en dados o gajos, tapada al microondas 6-8 min hasta que se pueda pinchar.","Sartén con la mitad del aceite: la patata hasta que se dore un poco y el CALABACÍN en rodajas, sal. Aparta a un lado o a un plato.","MERLUZA (mejor descongelada y bien seca) con el resto del aceite, fuego medio, vuelta y vuelta hasta que se separe en láminas. Perejil."],"tips":["Patata en rodajas finas (½ cm): así se hace en el mismo tiempo que el pescado."],"use":["A mié"]},{"id":"dorada-con-patata-y-calabacin","t":"Dorada con patata y calabacín","cat":"Cena","meta":"Miércoles B · cena · 30 min","cond":"sal, perejil, limón, ajo solo para el aceite","ing":[["dorada en filetes","230 g","170 g"],["patata","180 g","250 g"],["calabacín","200 g","200 g"]],"oil":"1 cucharada sopera (≈13 g)","s":["PATATA en dados o gajos, tapada al microondas 6-8 min hasta que se pueda pinchar.","Sartén con la mitad del aceite: la patata hasta que se dore un poco y el CALABACÍN en rodajas, sal. Aparta.","DORADA con la piel hacia abajo, fuego medio-fuerte, hasta que la piel esté crujiente; vuelta un momento y listo."],"tips":["Patata en rodajas finas (½ cm): así se hace en el mismo tiempo que el pescado.","Pedid que os la limpien y saquen en filetes. Fresca: 1-2 días en la nevera o al congelador.","Haz 2-3 cortes en la piel: así no se encoge en la sartén."],"use":["B mié"]},{"id":"sepia-a-la-sarten-con-patatas-y-ensalada","t":"Sepia a la sartén con patatas y ensalada","cat":"Cena","meta":"Jueves B · cena · 25 min","cond":"ajo solo para el aceite, perejil, limón, unas gotas de soja tamari (opcional)","ing":[["sepia limpia","350 g","250 g"],["patata","180 g","250 g"],["ensalada de bolsa","60 g","60 g"],["tomate","150 g","150 g"],["mandarinas","1 u","2 u"]],"oil":"1 cucharada sopera y media (≈21 g)","s":["PATATA en dados al microondas tapada, 8-10 min.","SEPIA en tiras, muy seca. Sartén muy caliente con parte del aceite (para Natalia, ajo solo para dorar el aceite y fuera).","Sepia 3-4 min. Perejil y limón. Ensalada y tomate con el resto del aceite."],"tips":["Sepia congelada: descongélala en la nevera la noche antes y sécala bien.","Salsa de soja tamari Kikkoman sin gluten: de 1 cucharilla pequeña (de café) a 1 cucharada sopera para el plato de los dos. 1 cucharada sopera ≈ 2,5 g de sal: ese día, no añadas sal."],"use":["B jue"]},{"id":"ensalada-de-patata-atun-y-judias","t":"Ensalada de patata, atún y judías","cat":"Cena","meta":"Sábado A · cena · 20 min","cond":"sal, vinagre, orégano","ing":[["patata","150 g","220 g"],["atún al natural","1 lata","1 lata"],["judías verdes congeladas","150 g","150 g"],["tomate","150 g","150 g"],["garbanzos de bote (escurridos)","60 g","—"]],"oil":"1 cucharada sopera (≈16 g)","s":["PATATA en dados y JUDÍAS: microondas tapadas 10-12 min o hervidas 12-15. A enfriar.","TOMATE en trozos. Atún escurrido (1 lata cada uno). Mario: + 60 g de garbanzos.","Aliña con el aceite, vinagre y sal."],"tips":["Hecha a mediodía y a la nevera, está mejor fría."],"use":["A sáb"]},{"id":"tortilla-de-calabacin-con-ensalada-de-col-rizada","t":"Tortilla de calabacín con ensalada de col rizada","cat":"Cena","meta":"Martes A · cena · 20 min","cond":"sal","ing":[["huevos","2 u","2 u"],["calabacín","150 g","150 g"],["tomate","150 g","150 g"],["pan 100 % integral","50 g","—"],["col rizada (kale)","80 g","60 g"],["olivas verdes","15 g","10 g"],["pan de arroz","—","60 g"]],"oil":"1 cucharada sopera (≈16 g)","s":["CALABACÍN en dados pequeños con parte del aceite, fuego medio, 8-10 min, hasta que esté blando y sin agua.","Bate los 4 huevos con sal y mezcla con el calabacín.","Sartén con un hilo de aceite, fuego medio-bajo: 3-4 min, vuelta con un plato, 2 min.","Reparto: Mario algo más de la mitad. Ensalada de col rizada y pan (integral M, de arroz N)."],"tips":["Si el calabacín aún suelta agua, la tortilla queda aguada: que esté bien seco."],"use":["A mar"]},{"id":"tortilla-de-patata-con-ensalada-de-col-rizada","t":"Tortilla de patata con ensalada de co function periodKey(freq){
  const d = new Date(); const iso = (x) => x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0');
  if (freq === 'diaria') return iso(d);
  if (freq === 'mensual') return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  return 'sem-' + iso(mondayOf(d));
}

  const tab = v === 'inicio' || v === 'menu' ? 'inicio' : v === 'receta' ? (S.prev === 'recetas' ? 'recetas' : 'inicio') : ['notas','alimentos','hogar','restaurantes','batch'].includes(v) ? 'mas' : v;
  $('#tabs').innerHTML = [['inicio', IC.menu, 'Menú'], ['recetas', IC.grid, 'Alternativas'], ['lista', IC.cart, 'Lista'], ['mas', IC.more, 'Más']]
    .map((t) => '<button class="tab' + (tab === t[0] ? ' on' : '') + '" data-go="' + t[0] + '"' + (tab === t[0] ? ' aria-current="page"' : '') + '><span class="ic">' + t[1] + '</span>' + t[2] + '</button>').join('');
  const q = $('#q'); if (q && S._focusQ) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
  const fq = $('#fq'); if (fq && S._focusF) { fq.focus(); fq.setSelectionRange(fq.value.length, fq.value.length); }
}

/* ---------- eventos ---------- */
document.addEventListener('click', async (e) => {
  const b = e.target.closest('button'); if (!b || b.disabled) return;
  const d = b.dataset;
  if (d.go) return go(d.go);
  if (d.meropen) { S.merOpen = S.merOpen === d.meropen ? null : d.meropen; return render(); }
  if ('merienda' in d) { go('notas'); const el = $('#meriendas'); if (el) el.scrollIntoView({block: 'start'}); return; }
  if (d.day) { S.day = +d.day; return render(); }
  if (d.week) { S.week = d.week; if (S.view === 'menu') S.day = 0; return render(); }
  if (d.who) { S.who = d.who; store.set('who', d.who); return render(); }
  if (d.rec !== undefined) return go('receta', {prev: S.view === 'receta' ? S.prev : S.view, rec: d.rec, step: 0, ctx: d.ctxid || d.ctx || null});
  if (d.rectab) { S.recTab = d.rectab; return render(); }
  if (d.swapopen) { S.swapOpen = S.swapOpen === d.swapopen ? null : d.swapopen; return render(); }
  if (d.swap) { const [key, id] = d.swap.split('|'); S.swapOpen = null; return writeSwap(key, id); }
  if (d.unswap) return writeSwap(d.unswap, null);
  if (d.hwk) { S.hwk = d.hwk; return render(); }
  if (d.bwk) { S.bwk = d.bwk; return render(); }
  if (d.task) return toggleTask(d.task);
  if (d.taskwho) return cycleWho(d.taskwho);
  if (d.taskdel) { S.confirm = 'task:' + d.taskdel; return render(); }
  if (d.taskdelYes) { S.confirm = null; render(); return db.doc('tareas/' + d.taskdelYes).delete().then(() => toast('Tarea quitada')).catch(() => toast('No se pudo quitar.')); }
  if ('restnew' in d) { S.restForm = {}; return render(); }
  if (d.restedit) { S.restForm = Object.assign({}, S.rests.find((r) => r.id === d.restedit)); return render(); }
  if ('restcancel' in d) { S.restForm = null; return render(); }
  if (d.restdel) { S.confirm = 'rest:' + d.restdel; return render(); }
  if (d.restdelYes) return deleteRest(d.restdelYes);
  if ('logo' in d) return $('#logo-input').click();
  if ('back' in d) return go(S.prev === 'receta' ? (S.prev === 'recetas' ? 'recetas' : 'inicio') : S.prev);
  if (d.filt) { S.filt = d.filt; return render(); }
  if (d.ft) { S.ft = d.ft; S.fq = ''; return render(); }
  if ('fmenu' in d) { S.fmenu = !S.fmenu; return render(); }
  if (d.rw) { S.rw = d.rw; return render(); }
  if ('cook' in d) { S.cook = true; S.step = 0; render(); return window.scrollTo(0, 0); }
  if ('uncook' in d) { S.cook = false; return render(); }
  if ('prev' in d) { S.step = Math.max(0, S.step - 1); return render(); }
  if ('next' in d) { const r = recById(S.rec); if (S.step >= r.s.length - 1) { S.cook = false; toast('Receta terminada'); } else S.step++; return render(); }
  if (d.mode) { S.mode = d.mode; return render(); }
  if (d.grp) { S.closed[d.grp] = !S.closed[d.grp]; return render(); }
  if (d.item) return toggleItem(d.item);
  if ('markall' in d) return markAll();
  if ('reset' in d) { S.confirm = 'reset'; return render(); }
  if ('resetYes' in d) return resetWeek();
  if ('cancel' in d) { S.confirm = null; return render(); }
  if ('photo' in d) return $('#photo-input').click();
  if ('delphoto' in d) { S.confirm = 'delphoto'; return render(); }
  if ('delphotoYes' in d) return deletePhoto();
});
document.addEventListener('submit', (e) => {
  e.preventDefault();
  if (e.target.id === 'f-task') return addTask();
  if (e.target.id === 'f-rest') return saveRest();
});
document.addEventListener('input', (e) => { if (e.target.id === 'q') { S.q = e.target.value; S._focusQ = true; render(); S._focusQ = false; } if (e.target.id === 'fq') { S.fq = e.target.value; S._focusF = true; render(); S._focusF = false; } });

/* ---------- compra compartida ---------- */
function writeChecks(wk, patch){
  Object.assign(S.checks[wk], patch);
  Object.keys(patch).forEach((k) => { if (!patch[k]) delete S.checks[wk][k]; });
  render();
  if (!db) return;
  db.doc('compra/semana-' + wk).set(Object.assign({}, S.checks[wk])).catch(() => toast('No se pudo guardar. Revisa la conexión.'));
}
function toggleItem(k){ const wk = S.week; writeChecks(wk, {[k]: !S.checks[wk][k]}); }
function markAll(){ const wk = S.week; const p = {}; DATA.shop[wk].forEach((g) => g.items.forEach((it) => { p[it.k] = true; })); writeChecks(wk, p); toast('Todo marcado como comprado'); }
function resetWeek(){ const wk = S.week; S.checks[wk] = {}; S.confirm = null; render(); if (db) db.doc('compra/semana-' + wk).set({}).catch(() => toast('No se pudo guardar. Revisa la conexión.')); toast('Lista de la semana ' + wk + ' sin marcas'); }

/* ---------- cambios de plato ---------- */
function writeSwap(key, id){
  const wk = S.week; const next = Object.assign({}, S.swaps[wk]);
  if (id) next[key] = id; else delete next[key];
  S.swaps[wk] = next; render(); toast(id ? 'Plato cambiado' : 'Plato original de nuevo');
  if (db) db.doc('cambios/semana-' + wk).set(next).catch(() => toast('No se pudo guardar. Revisa la conexión.'));
}
/* ---------- hogar ---------- */
function toggleTask(id){
  const t = S.tasks.find((x) => x.id === id); if (!t || !db) return;
  const pk = periodKey(t.freq); const done = Object.assign({}, t.done || {}); if (done[pk]) delete done[pk]; else done[pk] = true;
  t.done = done; render();
  const full = Object.assign({}, t); delete full.id; full.done = done;
  db.doc('tareas/' + id).set(full).catch(() => toast('No se pudo guardar.'));
}
function cycleWho(id){
  const t = S.tasks.find((x) => x.id === id); if (!t || !db) return;
  const g = grpOf(t); t.g = g === 1 ? 2 : g === 2 ? 0 : 1; t.who = t.g ? 'rota' : 'both'; render();
  db.doc('tareas/' + id).update({g: t.g, who: t.who}).catch(() => toast('No se pudo guardar.'));
}
function addTask(){
  if (!db) return; const t = $('#task-t').value.trim(); if (!t) return;
  const g = Number($('#task-w').value); const data = {t: t, freq: $('#task-f').value, g: g, who: g ? 'rota' : 'both', cat: $('#task-c').value.trim(), done: {}, at: new Date().toISOString()};
  $('#task-t').value = ''; $('#task-c').value = '';
  db.collection('tareas').add(data).then(() => toast('Tarea añadida')).catch(() => toast('No se pudo añadir.'));
}
/* ---------- restaurantes ---------- */
function saveRest(){
  if (!db) return; const r = S.restForm || {};
  const data = {n: $('#r-n').value.trim(), tipo: $('#r-tipo').value.trim(), zona: $('#r-zona').value.trim(), precio: $('#r-precio').value, nota: $('#r-nota').value.trim(), logo: r.logo || '', at: r.at || new Date().toISOString()};
  if (!data.n) return;
  const p = r.id ? db.doc('restaurantes/' + r.id).set(data) : db.collection('restaurantes').add(data);
  S.restForm = null; render();
  p.then(() => toast('Restaurante guardado')).catch(() => toast('No se pudo guardar.'));
}
async function deleteRest(id){
  const r = S.rests.find((x) => x.id === id); S.confirm = null; render();
  try { await db.doc('restaurantes/' + id).delete(); if (r && r.logo && assets) assets.delete(r.logo).catch(() => {}); toast('Restaurante quitado'); }
  catch (e) { toast('No se pudo quitar.'); }
}
/* ---------- fotos ---------- */
function toJpeg(file, maxSide){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => { const max = maxSide || 1600; let w = img.naturalWidth, h = img.naturalHeight; const s = Math.min(1, max / Math.max(w, h)); w = Math.round(w * s); h = Math.round(h * s);
      const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(img, 0, 0, w, h); URL.revokeObjectURL(url);
      c.toBlob((b) => b ? res(b) : rej(new Error('blob')), 'image/jpeg', 0.84); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('decode')); };
    img.src = url;
  });
}
$('#logo-input').addEventListener('change', async (e) => {
  const f = e.target.files && e.target.files[0]; e.target.value = '';
  if (!f || !assets || !S.restForm) return;
  S.busy = true; render();
  try { const blob = await toJpeg(f, 600); const up = await assets.upload(blob, {type: 'image/jpeg'}); S.restForm.logo = up.id; toast('Logo subido'); }
  catch (err) { toast('No se pudo subir el logo.'); }
  S.busy = false; render();
});
$('#photo-input').addEventListener('change', async (e) => {
  const f = e.target.files && e.target.files[0]; e.target.value = '';
  if (!f || !assets || !S.rec) return;
  const rid = S.rec; S.busy = true; render();
  try {
    const blob = await toJpeg(f);
    const up = await assets.upload(blob, {type: 'image/jpeg'});
    const old = S.photos[rid] && S.photos[rid].asset;
    S.photos[rid] = {asset: up.id, at: new Date().toISOString()};
    if (db) await db.doc('fotos/' + rid).set({asset: up.id, at: S.photos[rid].at});
    if (old && old !== up.id) assets.delete(old).catch(() => {});
    toast('Foto guardada');
  } catch (err) {
    const code = err && err.code;
    toast(code === 'too_large' ? 'La foto es demasiado grande.' : code === 'not_granted' ? 'Hace falta permiso de edición para subir fotos.' : code === 'quota_or_state' ? 'No queda espacio para más fotos.' : 'No se pudo subir la foto. Prueba otra vez.');
  }
  S.busy = false; render();
});
async function deletePhoto(){
  const rid = S.rec; const p = S.photos[rid]; S.confirm = null;
  if (!p) return render();
  delete S.photos[rid]; render();
  try { if (db) await db.doc('fotos/' + rid).delete(); if (assets && p.asset) await assets.delete(p.asset); toast('Foto quitada'); }
  catch (e) { toast('No se pudo quitar la foto.'); }
}

/* ---------- arranque ---------- */
async function boot(){
  DATA = APP_DATA;
  const w = weekInfo(); S.week = w.week; S.rw = w.week; S.day = w.todayIdx;
  const h = (location.hash || '').slice(1); if (['menu','recetas','lista','mas','hogar','restaurantes','alimentos','notas','batch'].includes(h)) S.view = h;
  render();
  try { await LASSETS.init(); assets = LASSETS; } catch (e) { assets = null; }
  render();
  Promise.resolve(LDB).then((d) => {
    db = d; if (!db) return render();
    ['A','B'].forEach((wk) => db.doc('compra/semana-' + wk).onSnapshot((snap) => { S.checks[wk] = (snap.exists && snap.data()) || {}; render(); }, () => { S.live = false; render(); }));
    ['A','B'].forEach((wk) => db.doc('cambios/semana-' + wk).onSnapshot((snap) => { S.swaps[wk] = (snap.exists && snap.data()) || {}; render(); }, () => {}));
    db.collection('tareas').onSnapshot((qs) => { S.tasks = qs.docs.map((d) => Object.assign({id: d.id}, d.data())).sort((a, b) => (a.at || '').localeCompare(b.at || '')); render(); }, () => {});
    db.collection('restaurantes').onSnapshot((qs) => { S.rests = qs.docs.map((d) => Object.assign({id: d.id}, d.data())); render(); }, () => {});
    db.collection('fotos').onSnapshot((qs) => { const p = {}; qs.docs.forEach((doc) => { const v = doc.data(); if (v && v.asset) p[doc.id] = v; }); S.photos = p; render(); }, () => {});
  });
}
boot();
})();
</script>
